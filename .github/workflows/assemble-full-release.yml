name: Assemble FULL release from parts

# Une las partes de la APK FULL (subidas a Muse storage) y publica la
# pre-release de prueba. Creado para la R14 (Buddy muerto); no toca el
# workflow de recompilación. Solo workflow_dispatch manual.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        default: 'v1.4.6-full-r14-test'
      title:
        description: 'Release title'
        required: true
        default: 'Child of Light FULL v1.4.6 — PRUEBA (test, no es el release)'
      sha256:
        description: 'Expected SHA-256 of the reassembled APK'
        required: true
        default: '73754e3c9cb4c18a9cf6a799a7e57b8c3f7cff9722ae5bcc3419c42e1433c508'
      expected_size:
        description: 'Expected APK size in bytes'
        required: true
        default: '1625565567'
      part_urls:
        description: 'Part URLs in order part00..partNN, whitespace-separated'
        required: true
      part_count:
        description: 'Expected number of parts'
        required: true
        default: '17'
      # (Hunt v1.4.6, ronda 15, A5-R15-01; ronda 16, A5-R16-04.) The old
      # defaults said "PRUEBA R14": the stale defaults that fail
      # SILENTLY -- a wrong sha256/size/tag fails loudly at the verify
      # step or at `gh release create`, but the R14 body text (and the
      # R14 release title) would have shipped on the R15 pre-release.
      # Keep the defaults generic.
      notes:
        description: 'Release body'
        required: false
        default: 'PRUEBA — build de prueba para el teléfono del dueño. NO es el release final.'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-24.04
    # (Hunt v1.4.6, ronda 15, A5-R15-01.) The job and every step used to
    # carry no timeout-minutes at all, and the curl below had no
    # --max-time: a stalled part download could hang the job until the
    # 6 h GitHub default. Run #2 took ~2.5 min end to end; 60 min for
    # the job and 30/10/15 for the steps is generous and names the
    # hanging step instead of dying anonymously at the job timeout
    # (same treatment the main workflow gives its jobs, R7-11/R8-06).
    timeout-minutes: 60
    steps:
      - name: Checkout repo (gh needs a git repo to resolve the target)
        uses: actions/checkout@v4
        timeout-minutes: 10

      - name: Download parts
        timeout-minutes: 30
        env:
          PART_URLS: ${{ inputs.part_urls }}
          PART_COUNT: ${{ inputs.part_count }}
        run: |
          set -euo pipefail
          i=0
          for url in $PART_URLS; do
            f=$(printf 'part%02d' "$i")
            echo "Downloading $f"
            curl -fL --retry 3 --max-time 600 -o "$f" "$url"
            i=$((i + 1))
          done
          echo "Downloaded $i parts"
          test "$i" -eq "$PART_COUNT"

      - name: Reassemble and verify
        timeout-minutes: 10
        env:
          EXPECTED_SHA: ${{ inputs.sha256 }}
          EXPECTED_SIZE: ${{ inputs.expected_size }}
        run: |
          set -euo pipefail
          cat part* > ChildOfLight-recomp-v1.4.6-full.apk
          ACTUAL_SIZE=$(stat -c%s ChildOfLight-recomp-v1.4.6-full.apk)
          echo "size: $ACTUAL_SIZE (expected $EXPECTED_SIZE)"
          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE"
          ACTUAL_SHA=$(sha256sum ChildOfLight-recomp-v1.4.6-full.apk | cut -d' ' -f1)
          echo "sha256: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Publish pre-release
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          gh release create "$TAG" ChildOfLight-recomp-v1.4.6-full.apk --title "$TITLE" --notes "$NOTES" --prerelease
          gh release view "$TAG" --json tagName,name,assets --jq '{tag: .tagName, title: .name, assets: [.assets[] | {name: .name, size: .size}]}'
