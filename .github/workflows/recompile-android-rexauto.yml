# Recompile Child of Light for Android, via rexauto
#
# Adaptación del "Recompile for Android" de rexauto
# (Player124413/rexauto, rama arena/01a07629-rexauto, commit verificado
#  dac49b331f2632f0b050f469e35747721300b8b2) para el port nativo de
# Child of Light (Xbox 360 -> Android) en este repo.
#
# Uso: Actions -> "Recompile Child of Light for Android (rexauto)" -> Run workflow
#   iso_url:    URL de la ISO del juego (directa, Google Drive o Dropbox).
#               La ISO es la copia propia del usuario; nunca se commitea: solo
#               vive en el runner y se borra al terminar cada job.
#   iso_sha256: SHA-256 de la ISO (opcional, recomendado).
#
# Diferencias frente al android.yml original de rexauto (todas deliberadas,
# documentadas en docs/REXAUTo.md):
#   1. Nombre de proyecto fijo: `childoflight` (rexauto exige [a-z0-9_]{1,40};
#      `child-of-light` con guiones es inválido). No hay input `name`.
#   2. Doble checkout: este repo + rexauto en `rexauto/` (commit fijado arriba).
#      Este repo es un DELTA sobre rexauto@dac49b33: solo los archivos que
#      cambiamos o anadimos viven aqui (tools/rexauto/android/ + nuestro
#      tools/rexauto/tools/android_sdk.sh). El paso "Overlay our port tree"
#      los copia sobre el checkout rexauto ANTES del SDK y del Gradle; sin
#      el, el job construiria el launcher STOCK (sin parche Mali, sin fix
#      super.onCreate, sin espanol, sin pulso de entrada) -- P0-1, caza
#      ronda 2 (2026-11-13). El paso "Re-overlay tracked SDK files" vuelve
#      a copiar los archivos SDK trackeados DESPUES del SDK: android_sdk.sh
#      hace rm -rf y reconstruye solo desde parches, y los archivos SDK
#      trackeados (STFS de Fase 5 + ediciones a mano) no los produce ningun
#      parche -- sin el, un build con cache-miss perderia el soporte STFS
#      (prueba de assemble-android-tree.sh, 2026-11-13). Codegen (job recompile):
#      rexauto NO usa XenonRecomp: el codegen lo hace el binario del SDK
#      (rexglue.exe, v0.10.1 repack -- el fork xdzleo v0.10.0-rexauto.2
#      desaparecio 2026-11-14; ver release sdk-v0.10.1-repack). Los parches
#      0015-0022 de patches/XenonRecomp/ son contra hedge-dev/XenonRecomp y
#      NO aplican al arbol del SDK (no existen XenonRecomp/ ni XenonUtils/
#      ahi; verificado 2026-11-13). Tampoco se lee recomp/col.toml en CI: es
#      un manifest de XenonRecomp standalone; rexauto autora su propio
#      <name>_manifest.toml (stage init) y el SDK lee las opciones
#      *_as_local de la tabla [entrypoint] de ese manifest (config.cpp
#      ApplyToml; caza ronda 4 P0-1: top-level se ignora). El SDK YA
#      soporta as_local nativamente y NO emite un ppc_context.h podado (el
#      contexto es el del runtime, completo); db16cyc ya es no-op en el SDK
#      (build_db16cyc).
#      Lo que SI falta para que as_local sea CORRECTO es el pase
#      tools/localize_fix_col.py sobre el arbol generado (flush/copy-back
#      entre llamadas; sin el, el callee lee registros stale). El script YA
#      esta adaptado a la sintaxis del SDK (DEFINE_REX_FUNC /
#      REX_CALL_INDIRECT_FUNC / REX_FUNC_PROLOGUE, ronda 2 A P1-1, verificado
#      en fixture: 13 funciones / 39 marcadores LOCALIZE_FIX) y el glob ya
#      es childoflight_recomp.*.cpp. El cableado (inyeccion en el manifest +
#      paso localize + verificacion con tripwire) esta en el job recompile.
#   3. `runheal` por defecto `false` (igual que en rexauto Android): el heal
#      lanza el game.exe en el runner y no hay modo headless, asi que un
#      dispatch por defecto con `true` se quedaria colgado (hunt 4 P1-1).
#      Quien lo quiera lo activa a mano en el dispatch.
#      `heal_iters` por defecto `"6"` (en rexauto Android es `"4"`).
#   4. Keystore CI estable vía secretos (ver §6 de docs/REXAUTo.md): el YAML de
#      rexauto genera un keystore nuevo en cada run aunque su README diga que la
#      clave es estable — verificado leyendo el YAML. Aquí se restaura el
#      keystore del secreto CI_KEYSTORE_BASE64 si existe; si no existe, el job
#      falla con ::error:: (ronda 3, B-R3-1: la rama antigua generaba un
#      keystore fresco con contrasena aleatoria y la APK salia firmada en
#      verde, pero con otra llave: no instalaba encima de ninguna build
#      anterior y el unico aviso era un ::warning::).
#      P1-7 (ronda 2, auditor B): las contraseñas del keystore NUNCA van en el
#      repo (antes estaban hardcodeadas en build.gradle.kts, en los scripts
#      full y en este mismo workflow). Ahora se leen de los secretos
#      CI_KEYSTORE_STORE_PASSWORD / CI_KEYSTORE_KEY_PASSWORD (alias opcional
#      en CI_KEYSTORE_KEY_ALIAS) y llegan a Gradle como variables de entorno
#      (ver el paso "CI signing key"). El paso "Verify APK" comprueba ademas
#      la huella del certificado (B-R3-1): la APK debe estar firmada con la
#      llave corazon, no solo "firmada". El secreto antiguo
#      CI_KEYSTORE_PASSWORD existe pero NUNCA se leyó en ningún paso: es
#      legado; borrarlo tras crear los nuevos secretos (ver docs/REXAUTo.md
#      §6; el plan de rotación es ROTATION-PLAN-keystore.md en la raíz
#      del repo).
#   5. Modelo público (decisión del usuario 2026-11-13): el repo es PÚBLICO
#      para tener minutos ilimitados + runners grandes. La APK NUNCA sale como
#      Release público: solo como artefacto de Actions con retención corta
#      (7 días), y el repo no contiene código ni datos del juego (ver
#      docs/DMCA.md). El guard de repo privado de la versión anterior se quitó
#      con esta decisión.
#   6. Liberar disco + swap de 16 GB en el job `apk` (patrón UnleashedRecomp_Android):
#      los runners tienen ~14 GB de SSD y la build es grande.
#
# TODO (ver docs/REXAUTo.md §9):
#   - URL + SHA-256 de la ISO (input del usuario).
#   - Secretos CI_KEYSTORE_BASE64 + CI_KEYSTORE_STORE_PASSWORD +
#     CI_KEYSTORE_KEY_PASSWORD (+ CI_KEYSTORE_KEY_ALIAS, opcional) antes
#     del primer run de producción. (CI_KEYSTORE_PASSWORD es legado,
#     no se usa: ver §4.)
#   - Title ID 5841140D, verificado contra el dump (STFS header @0x360;
#     ronda 20, A5-R20-03: el mismo offset que StfsAsset.verifyUsable
#     lee en runtime; el metodo se valido reproduciendo los content
#     IDs de DLC_TABLE desde @0x32C).
#   - Jump tables: el CI salta jumptables siempre (--no-jumptables, no hay IDA).
#   - Verificar tools/localize_fix_col.py sobre codigo generado REAL del SDK:
#     el script YA esta adaptado a la sintaxis del SDK (DEFINE_REX_FUNC /
#     REX_CALL_INDIRECT_FUNC / REX_FUNC_PROLOGUE, ronda 2 A P1-1, verificado
#     en fixture: 13 funciones / 39 marcadores LOCALIZE_FIX) y el glob ya es
#     childoflight_recomp.*.cpp. Lo que falta es la confirmacion con salida
#     real del codegen (la del fixture es sintetica). El paso "Verify
#     register-as-local codegen + localize" FALLA el job si hay 0 marcadores
#     LOCALIZE_FIX en el arbol generado (tripwire): no se envia codigo
#     as_local=true sin el pase localize, porque el callee leeria registros
#     stale. NO borrar el tripwire. Informe:
#     ~/workspace/research/ci-codegen-2026-11-13.md (en el workspace, no en el repo).
#     El APK de CI (job apk) SI lleva nuestros archivos de app y parches SDK
#     gracias al overlay.

name: Recompile Child of Light for Android (rexauto)

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "Link to the Child of Light Xbox 360 ISO (direct, Google Drive or Dropbox)"
        required: true
        type: string
      iso_sha256:
        description: "Expected SHA-256 of the ISO (optional, recommended)"
        required: false
        type: string
      runheal:
        description: "Also run the Windows run-heal loop first (slower, more functions cured)"
        required: false
        default: false
        type: boolean
      heal_iters:
        description: "Max run-heal iterations (if enabled)"
        required: false
        default: "6"
        type: string
      baseline_arm:
        description: "Build for plain ARMv8.0 (older 2016-2017 SoCs) instead of ARMv8.2 (default, faster)"
        required: false
        default: false
        type: boolean

      xbmovie_probe:
        description: "Enable the xbmovie probe device for this run (run #9 experiment: the logo movie open returns EOF instead of failing, to test whether the guest waits for the movie)"
        required: false
        default: false
        type: boolean

run-name: "Android: childoflight (rexauto)"

permissions:
  contents: read

concurrency:
  group: android-childoflight
  cancel-in-progress: false

env:
  # Fixed project name (rexauto requires [a-z0-9_]{1,40}).
  REX_PROJECT: childoflight
  # Pinned rexauto commit (verified 2026-11-13; branch arena/01a07629-rexauto).
  REXAUTO_REF: dac49b331f2632f0b050f469e35747721300b8b2

jobs:
  # ------------------------------------------------------------------ codegen
  recompile:
    name: "codegen + static heal (windows)"
    runs-on: windows-2022
    # (A5-R4-05, ronda 4.) Job timeout is the platform ceiling: GitHub
    # documents 360 min as the job default and the GitHub-hosted execution
    # limit is 6 h, so 360 is the most this job can ever get. The six step
    # timeouts below sum to 350 (10 + 10 + 30 + 60 + 60 + 180), so every
    # long step budget is honourable inside the job budget. Previously the
    # steps summed to 510 against a 350-min job (phase 1 + phase 2 alone
    # were 360 > 350), so the 240-min phase-2 budget could never be
    # honoured in full. (V-A5-01 added the Python-deps timeout to the
    # count: it was untimed before, so the old sum missed it.)
    # (A5-R7-11, ronda 7; aritmetica corregida A5-R8-05, ronda 8;
    # actualizada A5-R14-01, ronda 14; corregida A5-R19-05, ronda 19.)
    # The old comment also assumed the steps WITHOUT a timeout
    # (checkouts, injections, localize, pack, uploads, ...) fit in the
    # 10 min left over -- an untested hypothesis. 28 of the 29 steps in
    # this job now carry their own timeout-minutes, and their sum is
    # 570, not the 560 the R14-01 comment claimed: the six long steps
    # sum to 350 (10 + 10 + 30 + 60 + 60 + 180) and the other 22 timed
    # steps sum to 220. The R14-01 arithmetic predates the "Guard R14
    # crash" step (ronda 15, A2-R15-01, 10 min), which added one timed
    # step and 10 min without updating this comment (560 + 10 = 570).
    # Only "Validate inputs" has no timeout (a one-line regex that
    # cannot hang). Step timeouts are per-step ATTRIBUTION caps, NOT an
    # additive budget: their sum (570) exceeds the job ceiling by
    # design -- steps run sequentially and the job timeout (360) is
    # still the hard ceiling that fires first if the run as a whole
    # overruns. A step cap only fires when that single step hangs past
    # its own cap, so the failure names the hanging step instead of
    # dying anonymously at the job timeout.
    timeout-minutes: 360
    outputs:
      title: ${{ steps.meta.outputs.title }}
      title_id: ${{ steps.meta.outputs.title_id }}
    env:
      REXAUTO_WORK: ${{ github.workspace }}\autoports
      REXAUTO_PORTABLE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      # ReXGlue SDK: el fork xdzleo (v0.10.0-rexauto.2) desaparecio de
      # GitHub el 2026-11-14 (404) y era de donde bajaba el SDK el run #1.
      # Usamos el repack oficial v0.10.1 publicado en este repo (release
      # sdk-v0.10.1-repack; solo se quito el envoltorio win-amd64/).
      # REXAUTO_SDK_PIN=0 porque el pin exige el binario xdzleo y este
      # repack no es ese binario (setup.py pin_enforced).
      REXGLUE_BUNDLE_URL: https://github.com/sndaniel-arch/Xbox-juego-port/releases/download/sdk-v0.10.1-repack/rexglue-sdk-0.10.1-win-amd64-raw.zip
      # (A-2.) SHA-256 of that zip, verified 2026-11-19 by downloading the
      # public asset (46,035,081 B). The "Verify ReXGlue SDK bundle SHA-256"
      # step below fails the run on mismatch, and this value is part of the
      # job-1 cache key, so a re-uploaded asset under the same URL cannot be
      # served silently from cache. PENDING: publish the same hash in the
      # release body (see proposals/a2-sdk-sha.md).
      REXGLUE_BUNDLE_SHA256: c3fdf06b6e55271591b52ba6ab1fb5c1fd6de7f88032299117cac94e099bb241
      REXAUTO_SDK_PIN: "0"
    steps:
      - name: Guard CI versionCode stays below the FULL range (A5-R4-01, fail-fast)
        shell: pwsh
        timeout-minutes: 5
        run: |
          # (A5-R7-08, ronda 7.) The SAME guard also lives in the apk job
          # (defense in depth -- it is kept there), but it used to run only
          # after the whole windows codegen job plus the apk-job setup: a
          # run_number >= 1000000 would burn up to 3 h of codegen before
          # failing. Fail here, as the FIRST step of job 1, before any
          # checkout or codegen -- run_number needs no checkout. CI
          # versionCode is github.run_number and FULL releases use
          # 1_000_000 + major*10000 + minor*100 + patch (v1.4.6 FULL =
          # 1010406); a CI run_number >= 1_000_000 would ship a CI APK no
          # FULL release could update over (downgrade).
          if ([int]"${{ github.run_number }}" -ge 1000000) { Write-Host "::error::github.run_number ${{ github.run_number }} reached the FULL versionCode range (>= 1000000) -- CI codes must stay below 1_000_000; see the FULL versionCode scheme"; exit 1 }
          Write-Host "CI versionCode ${{ github.run_number }} < 1000000 (FULL range starts at 1000000)"

      - name: Validate inputs
        shell: pwsh
        run: |
          if ("${{ inputs.iso_url }}".Trim() -notmatch '^https?://') { Write-Host "::error::iso_url must start with http(s)://"; exit 1 }
          # (Hunt v1.4.6, ronda 13, A5-R13-05.) heal_iters and
          # iso_sha256 used to be validated only by failing late: a
          # non-numeric heal_iters died in rexauto's argparse after the
          # download + SDK install (~15 min in), and a mistyped
          # iso_sha256 died in "Verify ISO SHA-256" after the whole
          # download. Both fail loudly, but late -- validate here, in
          # the first step, before any checkout or download.
          if ("${{ inputs.heal_iters }}".Trim() -notmatch '^\d+$') { Write-Host "::error::heal_iters must be a non-negative integer"; exit 1 }
          if (("${{ inputs.iso_sha256 }}".Trim() -ne '') -and ("${{ inputs.iso_sha256 }}".Trim() -notmatch '^[0-9a-fA-F]{64}$')) { Write-Host "::error::iso_sha256 must be 64 hex characters (SHA-256)"; exit 1 }

      - uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Checkout rexauto (pinned commit)
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          repository: Player124413/rexauto
          ref: ${{ env.REXAUTO_REF }}
          path: rexauto

      - name: Overlay tracked ci_fetch.py (A-1)
        shell: pwsh
        timeout-minutes: 5
        run: |
          # ci_fetch.py is upstream (Player124413/rexauto, NOT tracked there);
          # our copy under tools/rexauto/tools/ is a delta on it, exactly like
          # android_sdk.sh (job 2 overlay). It emits downloaded_file +
          # downloaded_sha256 before unpacking, so the "Verify ISO SHA-256"
          # step can check the real downloaded file instead of skipping with
          # a warning when pick_container returns a directory. If this copy
          # ever goes missing, the fetch step falls back to the upstream file
          # and the verify step degrades to its old directory-skip behaviour.
          Copy-Item tools/rexauto/tools/ci_fetch.py rexauto/tools/ci_fetch.py
          if (-not (Select-String -Path rexauto/tools/ci_fetch.py -Pattern "downloaded_sha256" -Quiet)) { Write-Host "::error::tracked ci_fetch.py does not emit downloaded_sha256"; exit 1 }

      - name: Overlay tracked ci_sdk.py (A5-R7-03)
        shell: pwsh
        timeout-minutes: 5
        run: |
          # (A5-R7-03, ronda 7.) ci_sdk.py is upstream (Player124413/rexauto,
          # NOT tracked there); our copy under tools/rexauto/tools/ is a delta
          # on it, exactly like ci_fetch.py (A-1) above. Only cmd_verify()
          # differs: a pin mismatch is a LOUD failure (sys.exit(1)) instead
          # of a warning that silently disabled the pin. Without this copy,
          # "Verify SDK pin" would run the upstream file and the pin check
          # could never fail. The marker below proves the overlaid file is
          # ours, not the upstream one.
          Copy-Item tools/rexauto/tools/ci_sdk.py rexauto/tools/ci_sdk.py
          if (-not (Select-String -Path rexauto/tools/ci_sdk.py -Pattern "refusing to build against an unpinned SDK" -Quiet)) { Write-Host "::error::tracked ci_sdk.py does not fail on pin mismatch"; exit 1 }

      - name: Gate codegen/runtime SDK version skew (A5-R4-04)
        shell: pwsh
        timeout-minutes: 5
        run: |
          # (A5-R4-04, ronda 4.) Codegen runs the 0.10.1 repack bundle
          # while the Android runtime builds from SDK 0.10.0 + patches: a
          # major.minor skew would compile generated code against a
          # different SDK than the one that generated it. Patch-level skew
          # (0.10.1 vs 0.10.0) is a KNOWN, ACCEPTED divergence: the Android
          # patches were written against 0.10.0 and must NOT be rebased to
          # 0.10.1 without re-verifying every patch (see also the comment
          # on SDK_TAG in tools/rexauto/tools/android_sdk.sh). Fail only
          # when major.minor differ.
          $bundleUrl = "${{ env.REXGLUE_BUNDLE_URL }}"
          $m = [regex]::Match($bundleUrl, "rexglue-sdk-(\d+)\.(\d+)\.\d+-")
          if (-not $m.Success) { Write-Host "::error::could not parse codegen SDK version from REXGLUE_BUNDLE_URL: $bundleUrl"; exit 1 }
          $codegen = "$($m.Groups[1].Value).$($m.Groups[2].Value)"
          $tagLine = Select-String -Path tools/rexauto/tools/android_sdk.sh -Pattern '^SDK_TAG="v\d+\.\d+\.\d+"' | Select-Object -First 1
          if (-not $tagLine) { Write-Host "::error::SDK_TAG not found in tools/rexauto/tools/android_sdk.sh"; exit 1 }
          $t = [regex]::Match($tagLine.Line, 'v(\d+)\.(\d+)\.\d+')
          if (-not $t.Success) { Write-Host "::error::could not parse SDK_TAG from: $($tagLine.Line)"; exit 1 }
          $runtime = "$($t.Groups[1].Value).$($t.Groups[2].Value)"
          Write-Host "codegen SDK (bundle): $codegen; runtime SDK (android_sdk.sh SDK_TAG): $runtime"
          if ($codegen -ne $runtime) { Write-Host "::error::SDK major.minor skew: codegen bundle is $codegen but the Android runtime builds from $runtime -- generated code would be compiled against a different SDK than the one that generated it"; exit 1 }
          Write-Host "SDK major.minor match ($codegen); patch-level skew is known and accepted"

      - uses: actions/setup-python@v7
        timeout-minutes: 10
        with:
          python-version: "3.12"

      - name: Python deps
        shell: pwsh
        timeout-minutes: 10
        run: |
          # gdown: rexauto tools/ci_fetch.py calls gdown.download(..., fuzzy=True)
          # and installs gdown itself with plain `pip install gdown` (no
          # --upgrade), so the version here decides. PIN to 5.2.0: the
          # runner's pre-installed gdown predates fuzzy (run #2 died on
          # TypeError), and an unpinned --upgrade installs 6.x, which
          # REMOVED fuzzy (run #3 died on the same TypeError). Verified
          # against the real wheels: 6.5.1 has no fuzzy, 5.2.0 has it.
          # (Hunt v1.4.6, ronda 20, A5-R20-01.) This pip install had no
          # retry: a transient PyPI failure killed the run here, before
          # codegen, with no second chance -- while every other network
          # fetch in this workflow retries (apt x3, sdkmanager x3, SDK
          # install x3, game input x3, Stage assets pillow x3 since
          # A5-R19-07). "Python deps" was the last bare network install
          # left. Retry 3 times, sleep 10 (same shape as the Stage
          # assets pillow loop; the while/$attempt skeleton is the one
          # the SDK install and game input loops in this same file use).
          # The $LASTEXITCODE check below (A5-R4-02) still runs after
          # the loop as a backstop: the loop itself exits 1 on the 3rd
          # failure, so the check only ever sees 0.
          $attempt = 0
          while ($true) {
            $attempt++
            python -m pip install -q --upgrade pip "pillow==13.0.0" "gdown==5.2.0"
            if ($LASTEXITCODE -eq 0) { Write-Host "pip install OK (attempt $attempt)"; break }
            if ($attempt -ge 3) { Write-Host "::error::pip install failed after 3 attempts"; exit 1 }
            Write-Host "::warning::pip install attempt $attempt failed, retrying in 10s..."
            Start-Sleep -Seconds 10
          }
          # (A5-R4-02, ronda 4.) pwsh only reports the LAST native
          # command's exit code ($LASTEXITCODE): a failed pip install used
          # to be masked by the import below succeeding against the
          # runner's stale pre-installed gdown (runs #2/#3 died later on
          # the fuzzy TypeError). Fail here on a bad pip exit, and assert
          # the exact pinned version instead of only printing it.
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::pip install failed (exit $LASTEXITCODE) -- refusing to continue with a possibly stale pre-installed gdown"; exit 1 }
          python -c "import gdown; assert gdown.__version__ == '5.2.0', gdown.__version__; print('gdown version:', gdown.__version__)"

      - name: Toolchain
        shell: pwsh
        timeout-minutes: 10
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { Write-Host "::error::vcvars64.bat not found"; exit 1 }
          "VCVARS=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            "CLANG=$env:ProgramFiles\LLVM\bin\clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "CLANGXX=$env:ProgramFiles\LLVM\bin\clang++.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          # (M-3.) Assert the toolchain that will actually compile: the
          # windows-2022 image rolls monthly (VS servicing, LLVM bumps) while
          # the label stays the same, and run #16 died on STL1000 (MSVC 14.52
          # demanding Clang 22+) before compiling anything. Print both
          # versions and fail fast on the known-bad combination instead of
          # burning a 20-minute codegen first.
          $clangExe = (Get-Command clang -ErrorAction SilentlyContinue).Source
          if (-not $clangExe) { $clangExe = "$env:ProgramFiles\LLVM\bin\clang.exe" }
          if (-not (Test-Path $clangExe)) { Write-Host "::error::clang not found (PATH nor $env:ProgramFiles\LLVM\bin\clang.exe)"; exit 1 }
          $clangVer = (& $clangExe --version | Select-Object -First 1)
          Write-Host "clang: $clangVer ($clangExe)"
          $clangMajorMatch = [regex]::Match($clangVer, "clang version (\d+)")
          if (-not $clangMajorMatch.Success) { Write-Host "::error::could not parse clang version from: $clangVer"; exit 1 }
          $clangMajor = [int]$clangMajorMatch.Groups[1].Value
          $msvcDir = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty Name
          Write-Host "MSVC tools version: $msvcDir (VS install: $vs)"
          $msvcParts = $msvcDir.Split(".")
          $msvcBad = ([int]$msvcParts[0] -gt 14) -or (([int]$msvcParts[0] -eq 14) -and ([int]$msvcParts[1] -ge 52))
          if ($msvcBad -and ($clangMajor -lt 22)) { Write-Host "::error::STL1000 combination: MSVC $msvcDir requires Clang 22+, but clang is $clangMajor ($clangVer). Pin an older windows-2022 image or install LLVM >= 22."; exit 1 }

      - name: Resolve pinned SDK URL
        id: sdk
        shell: pwsh
        timeout-minutes: 5
        working-directory: rexauto
        run: |
          $url = (python tools/ci_sdk.py url)
          "url=$url" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/cache@v6
        id: sdk-cache
        # (Hunt v1.4.6, ronda 11, A5-R11-04.) This was one of only two
        # steps in job 1 without a timeout (the other is "Validate
        # inputs", a one-line regex that cannot hang); every cache step
        # in job 2 carries one (30/60). A hung cache restore here used
        # to burn the whole 360-min job budget instead of failing fast
        # with the step named.
        timeout-minutes: 30
        with:
          path: rexauto/rexglue
          # (Hunt v1.4.6, ronda 20, A5-R20-04.) The key used to name
          # rexauto.py as the rexauto input, but rexauto.py is not in the
          # SDK install path (ci_sdk.py cmd_install imports setup only;
          # only cmd_verify imports rexauto) -- the installed tree is
          # laid out by gui/setup.py:_lay_out_sdk from the bundle. A pin
          # bump that touched only setup.py (or ci_sdk.py) served the
          # previous tree: same key, cache-hit, install skipped, and the
          # marker check still passed (the marker is only the bundle
          # SHA). Key on the pin itself (any upstream change invalidates)
          # plus the two files that determine the install. One cache
          # miss on the first run with the new key; the reinstall is
          # the price of the corrected key.
          key: rexglue-sdk-${{ env.REXGLUE_BUNDLE_SHA256 }}-${{ env.REXAUTO_REF }}-${{ hashFiles('rexauto/gui/setup.py', 'rexauto/tools/ci_sdk.py') }}-${{ steps.sdk.outputs.url }}

      - name: Verify ReXGlue SDK bundle SHA-256
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        timeout-minutes: 10
        run: |
          # (A-2.) The install step downloads the zip into a temp file and
          # DELETES it (gui/setup.py), so the hash cannot be checked after
          # install: download a verification copy here (46 MB, cache-miss
          # runs only) and fail before codegen on mismatch. The install step
          # still downloads its own copy afterwards; the double download is
          # the price of not editing upstream setup.py.
          $zip = "$env:RUNNER_TEMP\rexglue-sdk-verify.zip"
          curl.exe --fail -L --retry 3 --retry-delay 10 -o "$zip" "${{ steps.sdk.outputs.url }}"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::could not download the SDK bundle for hash verification"; exit 1 }
          $expected = "${{ env.REXGLUE_BUNDLE_SHA256 }}".Trim().ToUpper()
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash
          Write-Host "expected: $expected"
          Write-Host "actual:   $actual"
          Remove-Item $zip -Force
          if ($actual -ne $expected) { Write-Host "::error::SDK bundle SHA-256 mismatch: the release asset is not the audited sdk-v0.10.1-repack zip (re-uploaded, or wrong URL). Refusing to build with an unverified SDK."; exit 1 }
          Write-Host "SDK bundle SHA-256 OK"

      - name: Install ReXGlue SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: rexauto
        timeout-minutes: 30
        env:
          REXGLUE_BUNDLE_URL: ${{ steps.sdk.outputs.url }}
        run: |
          # (J-8.) gui/setup.py:install_rexglue does urlopen(..., timeout=60)
          # with a single attempt; setup.py is upstream (NOT tracked), so the
          # retry with backoff lives here. Only matters on cache-miss runs.
          $attempt = 0
          while ($true) {
            $attempt++
            python tools/ci_sdk.py install
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -ge 3) { Write-Host "::error::SDK install failed after 3 attempts"; exit 1 }
            Write-Host "::warning::SDK install attempt $attempt failed, retrying in 30s..."
            Start-Sleep -Seconds 30
          }
          # (A5-R7-03, ronda 7.) Integrity marker: the cache path above
          # (rexauto/rexglue) is saved wholesale by actions/cache, so this
          # file travels with the cached tree. The "Verify cached SDK
          # integrity" step below reads it on EVERY run (cache-hit or not)
          # and fails if it is missing or does not match
          # REXGLUE_BUNDLE_SHA256 -- a restored cache entry is only
          # trusted if it proves it came from the audited bundle.
          "${{ env.REXGLUE_BUNDLE_SHA256 }}" | Out-File -FilePath "rexglue/.bundle-sha256" -Encoding utf8 -NoNewline
          Write-Host "SDK integrity marker written: rexglue/.bundle-sha256"

      - name: Verify cached SDK integrity (A5-R7-03)
        shell: pwsh
        timeout-minutes: 10
        run: |
          # (A5-R7-03, ronda 7.) Runs on EVERY run (no `if:`): the
          # "Verify ReXGlue SDK bundle SHA-256" and "Install ReXGlue SDK"
          # steps above are skipped on a cache-hit, so a restored tree
          # used to reach codegen with no integrity check at all (and
          # "Verify SDK pin" only checks tool presence -- a pin mismatch
          # there is now fatal too, see tools/rexauto/tools/ci_sdk.py,
          # but it still inspects no SDK content). The marker was written
          # by the Install step inside the cached path (rexauto/rexglue),
          # so it travels with the cache entry; a mismatch means the
          # restored tree is not the audited sdk-v0.10.1-repack bundle.
          # NOTE: a cache entry written BEFORE this marker existed has no
          # marker file and fails here on purpose -- delete that stale
          # entry once (`gh cache delete` the rexglue-sdk key) and re-run;
          # the next entry carries the marker.
          $marker = "rexauto/rexglue/.bundle-sha256"
          if (-not (Test-Path $marker -PathType Leaf)) { Write-Host "::error::cached SDK integrity: marker $marker is missing -- the restored rexauto/rexglue tree was cached before A5-R7-03 (or is incomplete). Delete the stale rexglue-sdk cache entry (gh cache delete) and re-run; do not build codegen against an unverified SDK."; exit 1 }
          $marked = (Get-Content $marker -Raw).Trim()
          $expected = "${{ env.REXGLUE_BUNDLE_SHA256 }}".Trim()
          if ($marked -ne $expected) { Write-Host "::error::cached SDK integrity: marker says $marked, expected bundle SHA-256 $expected -- the restored rexauto/rexglue tree is not the audited sdk-v0.10.1-repack bundle. Delete the rexglue-sdk cache entry and re-run."; exit 1 }
          if (-not (Test-Path "rexauto/rexglue" -PathType Container)) { Write-Host "::error::cached SDK integrity: rexauto/rexglue is missing after cache restore"; exit 1 }
          $count = (Get-ChildItem "rexauto/rexglue" -Recurse -File -ErrorAction SilentlyContinue | Measure-Object).Count
          if ($count -lt 1) { Write-Host "::error::cached SDK integrity: rexauto/rexglue is empty after cache restore"; exit 1 }
          # (A5-R8-03, ronda 8.) The marker above proves PROVENANCE (the
          # tree came from the audited bundle), not CONTENT: a truncated
          # restore with an intact marker used to pass. Also require the
          # key binaries of the restored tree, non-empty. Paths are where
          # detect_env()/sdk_pin_mismatch() look for them: rexglue.exe and
          # rexruntime.dll are mirrored into rexglue/tool/ by
          # setup.py:_lay_out_sdk, and rexgpu-xenos.dll lives in
          # rexglue/sdk/bin/ (it is NOT mirrored into tool/ -- the pin
          # check in rexauto.py only inspects it when it sits next to
          # rexglue.exe, so accept any of its possible locations: tool/
          # (if a bundle ever mirrors it), sdk/bin/ (raw layout, the
          # 0.10.1 repack), or rexglue/bin/ (wrapped layout, where
          # _lay_out_sdk falls back to sdk = rexglue/).
          foreach ($f in @("rexauto/rexglue/tool/rexglue.exe", "rexauto/rexglue/tool/rexruntime.dll")) { if (-not (Test-Path $f -PathType Leaf) -or (Get-Item $f).Length -eq 0) { Write-Host "::error::cached SDK integrity: key file $f is missing or empty in the restored rexauto/rexglue tree -- the cache entry is truncated. Delete the rexglue-sdk cache entry (gh cache delete) and re-run."; exit 1 } }
          $xenos = @("rexauto/rexglue/tool/rexgpu-xenos.dll", "rexauto/rexglue/sdk/bin/rexgpu-xenos.dll", "rexauto/rexglue/bin/rexgpu-xenos.dll") | Where-Object { (Test-Path $_ -PathType Leaf) -and (Get-Item $_).Length -gt 0 }
          if (-not $xenos) { Write-Host "::error::cached SDK integrity: rexgpu-xenos.dll is missing or empty in the restored rexauto/rexglue tree (looked in tool/, sdk/bin/ and bin/) -- the cache entry is truncated. Delete the rexglue-sdk cache entry (gh cache delete) and re-run."; exit 1 }
          Write-Host "cached SDK integrity OK: marker $marked matches the audited bundle SHA-256 ($count files under rexauto/rexglue; key binaries present)" 

      - name: Verify SDK pin
        shell: pwsh
        timeout-minutes: 10
        working-directory: rexauto
        run: python tools/ci_sdk.py verify

      - name: Download game input
        id: fetch
        timeout-minutes: 60
        shell: pwsh
        working-directory: rexauto
        run: |
          # (V-A5-02, ronda 4.) ci_fetch.py is single-attempt on all three
          # fetch paths (gdown / mega.py / urllib -- no retry inside), so a
          # transient network blip used to kill the whole run. Retry up to
          # 3 times, wiping the input dir between attempts: a partial
          # download must never be mistaken for a complete one on retry
          # (the direct-URL path truncates with "wb", but gdown's
          # existing-file behaviour is unverified). The step timeout (60)
          # still bounds the total: retries only help fast failures.
          # ci_fetch.py writes its GITHUB_OUTPUT only on success, so a
          # failed attempt leaves no stale outputs behind.
          $attempt = 0
          while ($true) {
            $attempt++
            python tools/ci_fetch.py "${{ inputs.iso_url }}" "${{ runner.temp }}\input"
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -ge 3) { Write-Host "::error::game input download failed after 3 attempts"; exit 1 }
            Write-Host "::warning::game input download attempt $attempt failed, wiping partial input and retrying in 30s..."
            # (Hunt v1.4.6, ronda 13, A5-R13-12.) The old
            # `-ErrorAction SilentlyContinue` swallowed a failed wipe:
            # the retry then ran with a partial download still on disk,
            # and gdown's existing-file behaviour is unverified (see the
            # comment above), so a partial file could be mistaken for a
            # complete one. Only skip the removal when there is nothing
            # to remove; a failed removal fails loudly here instead.
            if (Test-Path "${{ runner.temp }}\input") {
              Remove-Item -Recurse -Force "${{ runner.temp }}\input"
              if (Test-Path "${{ runner.temp }}\input") { Write-Host "::error::could not wipe the partial game input -- refusing to retry over a partial download"; exit 1 }
            }
            Start-Sleep -Seconds 30
          }

      - name: Verify ISO SHA-256 (if provided)
        if: inputs.iso_sha256 != ''
        shell: pwsh
        timeout-minutes: 10
        run: |
          $expected = "${{ inputs.iso_sha256 }}".Trim().ToUpper()
          # (A-1.) The tracked ci_fetch.py (see "Overlay tracked ci_fetch.py")
          # hashes the downloaded FILE before unpacking and exports it as
          # downloaded_sha256, so the check below runs on the real input for
          # EVERY input kind -- including the STFS-by-Drive case, where the
          # old code only saw a directory. The hash is of the file as
          # downloaded (an archive URL hashes the archive, not its contents).
          $downloadedSha = "${{ steps.fetch.outputs.downloaded_sha256 }}"
          if ($downloadedSha -ne "") {
            Write-Host "expected: $expected"
            Write-Host "actual (downloaded file ${{ steps.fetch.outputs.downloaded_file }}):   $downloadedSha"
            if ($downloadedSha.ToUpper() -ne $expected) { Write-Host "::error::SHA-256 mismatch: the downloaded game input is not the expected one"; exit 1 }
            Write-Host "iso_sha256 verified against the downloaded file"
            exit 0
          }
          # Fallback (upstream ci_fetch.py, no downloaded_sha256 output):
          # (Ronda 4, G-F1.) pick_container returns a DIRECTORY for .xex /
          # .zip inputs (it renames to default.xex and returns the folder),
          # and Get-FileHash cannot hash a directory: PowerShell 7 errors
          # with "Access to the path ... is denied" and 5.1 returns nothing,
          # so .Hash is $null either way and the comparison below would fail
          # with a false "SHA-256 mismatch" on a correct download. Skip the
          # check with a warning instead of failing the job. .iso / STFS
          # inputs still return a file and are verified as before.
          $container = "${{ steps.fetch.outputs.container }}"
          if (Test-Path $container -PathType Container) {
            Write-Host "::warning::iso_sha256 skipped: the game input is a directory ($container), not a single file -- Get-FileHash cannot hash it"
            exit 0
          }
          $actual = (Get-FileHash -Algorithm SHA256 $container).Hash
          Write-Host "expected: $expected"
          Write-Host "actual:   $actual"
          if ($actual -ne $expected) { Write-Host "::error::SHA-256 mismatch: the downloaded ISO is not the expected one"; exit 1 }

      - name: Recompile (extract + init)
        shell: pwsh
        timeout-minutes: 60
        working-directory: rexauto
        run: |
          # Phase 1 of the two-phase recompile: run rexauto only up to the
          # init stage, so the next step can inject the register-as-local
          # keys into the manifest rexauto authors. State is saved in
          # $REXAUTO_WORK\.rexauto_state, so completed stages are skipped
          # on the next invocation (rexauto.py --from/--until).
          # NOTE: --until init here must be the ONLY --until flag: argparse
          # keeps the last one, and the runheal-based "--until build" of
          # phase 2 would silently extend this phase past init.
          $args = @("${{ steps.fetch.outputs.container }}", "--name", "${{ env.REX_PROJECT }}",
                    "--no-jumptables", "--heal-iters", "${{ inputs.heal_iters }}", "--publish-gabarito",
                    "--until", "init")
          New-Item -ItemType Directory -Force "$env:REXAUTO_WORK\${{ env.REX_PROJECT }}" | Out-Null
          python rexauto.py @args 2>&1 | Tee-Object -FilePath "$env:REXAUTO_WORK\${{ env.REX_PROJECT }}\_pipeline-init.log"
          exit $LASTEXITCODE

      - name: Inject register-as-local into the manifest
        shell: pwsh
        timeout-minutes: 5
        run: |
          # Hunt 4 P0-1: the SDK reads the *_as_local / skip_* options from
          # the [entrypoint] table of the project manifest, NOT top-level
          # (ManifestConfig::Load -> LoadBinaryConfig(*entrypoint) ->
          # ApplyToml reads toml["ctr_as_local"] etc. from the table passed
          # in; the only top-level reader, RecompilerConfig::Load, has no
          # callers). Top-level copies are silently ignored (defaults false),
          # so insert them INSIDE [entrypoint], right after its header.
          # Idempotent: any previous copy of these keys is dropped first
          # (re-runs). skip_lr stays false. skip_msr = true and
          # non_volatile_as_local REMOVED (Alice T1/T2, 2026-11-15:
          # alice-nx proved non_volatile_as_local glitches textures
          # on ARM64 by bisection on real console; skip_msr is safe
          # and the biggest CPU gain measured in the ReXGlue family).
          $port = "$env:REXAUTO_WORK\${{ env.REX_PROJECT }}\port"
          $manifest = Join-Path $port "${{ env.REX_PROJECT }}_manifest.toml"
          if (-not (Test-Path $manifest)) { Write-Host "::error::manifest not found at $manifest -- the init stage did not produce it"; exit 1 }
          $keys = @(
            "ctr_as_local = true",
            "xer_as_local = true",
            "reserved_as_local = true",
            "cr_as_local = true",
            "non_argument_as_local = true",
            "skip_lr = false",
            "skip_msr = true"
          )
          $names = @("ctr_as_local","xer_as_local","reserved_as_local","cr_as_local","non_argument_as_local","non_volatile_as_local","skip_lr","skip_msr")
          $lines = [System.IO.File]::ReadAllLines($manifest)
          $kept = @()
          foreach ($l in $lines) {
            $m = [regex]::Match($l, '^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=')
            if ($m.Success -and ($names -contains $m.Groups[1].Value)) { continue }
            $kept += $l
          }
          $idx = -1
          for ($i = 0; $i -lt $kept.Count; $i++) { if ($kept[$i] -match '^\s*\[entrypoint\]\s*$') { $idx = $i; break } }
          if ($idx -lt 0) { Write-Host "::error::[entrypoint] section not found in $manifest -- the init stage did not author it"; exit 1 }
          $block = @("# register-as-local (injected by the workflow, CI codegen wiring 2026-11-13; hunt 4 P0-1: the SDK reads these from [entrypoint], NOT top-level):") + $keys
          $new = @()
          $new += $kept[0..$idx]
          $new += $block
          if (($idx + 1) -lt $kept.Count) { $new += $kept[($idx+1)..($kept.Count-1)] }
          [System.IO.File]::WriteAllLines($manifest, $new)
          foreach ($k in $keys) {
            $name = ($k -split '\s*=\s*', 2)[0]
            $value = ($k -split '\s*=\s*', 2)[1]
            $hits = @(Select-String -Path $manifest -Pattern ("^\s*" + [regex]::Escape($name) + "\s*=\s*" + [regex]::Escape($value) + "\s*$"))
            if ($hits.Count -ne 1) { Write-Host "::error::manifest key '$k' found $($hits.Count) times (want exactly 1)"; exit 1 }
          }
          Write-Host "manifest updated: $($keys.Count) codegen keys injected into $manifest"

      - name: Inject phone-reported functions into functions.toml
        shell: pwsh
        timeout-minutes: 5
        run: |
          # Run #9 seed (2026-11-18): the phone hit one more guest function
          # the recompile never emitted (0x8291FEE0 -- "Call to invalid or
          # unregistered function" in the FULL v1.4.3 log, right before the
          # logo movie lookup), and the expert sweep (run9/expert-sweep.md)
          # re-derived the whole gap: 68 more of the same family as XEX
          # pointers, drag 0 (none calls another gap function directly),
          # all with complete bodies. The phone proved the pattern 3 times
          # (crash 1 -> 2, crash 2 -> 2, now 0x8291FEE0), so all 68 go in
          # this run instead of one cycle each. Plus the 31 from runs #6-#8
          # (a clean checkout would otherwise regress them), into
          # childoflight_functions.toml -- the only function input the
          # recompile accepts (created empty by stage_init, read by codegen;
          # runheal writes there too). NEVER seed 0x82A51854 (switch label)
          # or the 9 code-region addresses (expert-sweep.md §5).
          # Idempotent: any previous copy of these addresses is dropped
          # first (re-runs). The file must end with exactly 99 entries.
          $port = "$env:REXAUTO_WORK\${{ env.REX_PROJECT }}\port"
          $fns = Join-Path $port "${{ env.REX_PROJECT }}_functions.toml"
          if (-not (Test-Path $fns)) { Write-Host "::error::functions.toml not found at $fns -- the init stage did not produce it"; exit 1 }
          $addrs = @(
            "0x827AE120",
            "0x827AE140",
            "0x8290F800",
            "0x8290F818",
            "0x82923D18",
            "0x82CCAA18",
            "0x82CCC8F8",
            "0x8290ACE0",
            "0x82170148",
            "0x82170128",
            "0x82170138",
            "0x822285B8",
            "0x822285C8",
            "0x822285D8",
            "0x8290ACA8",
            "0x8290ACB0",
            "0x8290ACB8",
            "0x8290ACC0",
            "0x8290ACD0",
            "0x8290ACD8",
            "0x8290AD38",
            "0x8290F810",
            "0x82910BC0",
            "0x82910BD0",
            "0x82910BD8",
            "0x82910BE0",
            "0x82910BE8",
            "0x82910BF0",
            "0x82910BF8",
            "0x82910C00",
            "0x82910C08",
            "0x82251278",
            "0x822C4440",
            "0x8237CE08",
            "0x82391570",
            "0x82391768",
            "0x823942B0",
            "0x82399D00",
            "0x8239AEB0",
            "0x823B7DE8",
            "0x823FA170",
            "0x823FC8B8",
            "0x823FF290",
            "0x823FF2B0",
            "0x82403F38",
            "0x8240A460",
            "0x8240EC08",
            "0x824896A8",
            "0x8251ED38",
            "0x82597EB0",
            "0x8260FA20",
            "0x826B22A8",
            "0x826B22B8",
            "0x826D0DA8",
            "0x826DC7B8",
            "0x827030D8",
            "0x8272AA48",
            "0x827CF9B0",
            "0x828FDF18",
            "0x829005B8",
            "0x8291FEE0",
            "0x82920A60",
            "0x829217C0",
            "0x82924698",
            "0x8292C0F8",
            "0x8292D900",
            "0x8292D908",
            "0x8292F170",
            "0x8292F188",
            "0x8292F198",
            "0x8294CA7C",
            "0x82951C24",
            "0x82952B18",
            "0x8295A368",
            "0x8295A380",
            "0x8295A3A0",
            "0x8295A528",
            "0x8295A548",
            "0x8295A568",
            "0x8295A588",
            "0x8295A5A8",
            "0x8295A5C8",
            "0x8295A5E8",
            "0x8295A608",
            "0x8295A628",
            "0x8295A648",
            "0x82961660",
            "0x82A5A310",
            "0x82AB9858",
            "0x82AB98E0",
            "0x82AB9908",
            "0x82AB9930",
            "0x82AB9958",
            "0x82AB9D70",
            "0x82AB9D90",
            "0x82B612E8",
            "0x82C2BAD0",
            "0x82C5AAA8",
            "0x82C65C10"
          )
          $lines = [System.IO.File]::ReadAllLines($fns)
          $kept = @()
          foreach ($l in $lines) {
            $m = [regex]::Match($l, '^\s*"(0x[0-9A-Fa-f]+)"\s*=')
            if ($m.Success -and ($addrs -contains $m.Groups[1].Value)) { continue }
            $kept += $l
          }
          $idx = -1
          for ($i = 0; $i -lt $kept.Count; $i++) { if ($kept[$i] -match '^\s*\[functions\]\s*$') { $idx = $i; break } }
          if ($idx -lt 0) { Write-Host "::error::[functions] section not found in $fns"; exit 1 }
          $block = @()
          foreach ($a in $addrs) { $block += "`"$a`" = {}" }
          $new = @()
          $new += $kept[0..$idx]
          $new += $block
          if (($idx + 1) -lt $kept.Count) { $new += $kept[($idx+1)..($kept.Count-1)] }
          [System.IO.File]::WriteAllLines($fns, $new)
          foreach ($a in $addrs) {
            $hits = @(Select-String -Path $fns -Pattern ('^\s*"' + [regex]::Escape($a) + '"\s*=\s*\{\}\s*$'))
            if ($hits.Count -ne 1) { Write-Host "::error::functions entry '$a' found $($hits.Count) times (want exactly 1)"; exit 1 }
          }
          # (Hunt v1.4.6, ronda 11, A5-R11-05.) The comment above says
          # the file must end with exactly 99 entries, but the loop only
          # proves each seeded address appears once -- extra entries
          # authored by the init stage (or left by a previous state)
          # would survive silently. Count the total: in a fresh runner
          # init creates this file empty and this step runs before
          # phase 2, so runheal cannot have added anything yet.
          $total = @(Select-String -Path $fns -Pattern '^\s*"0x[0-9A-Fa-f]+"\s*=\s*\{\}\s*$').Count
          if ($total -ne 99) { Write-Host "::error::functions.toml has $total entries (want exactly 99 seeded) -- the init stage authored extra entries or a seed is missing"; exit 1 }
          Write-Host "functions.toml updated: $($addrs.Count) phone-reported + audit functions seeded into $fns"

      - name: Recompile (codegen + static heal + build check)
        shell: pwsh
        timeout-minutes: 180
        working-directory: rexauto
        run: |
          # Phase 2: resume from setjmp with the injected manifest.
          # The init stage is skipped (state file), so the manifest is NOT
          # re-authored and the injected keys survive. runheal=false (the
          # default) still caps the run at build, as before.
          $args = @("${{ steps.fetch.outputs.container }}", "--name", "${{ env.REX_PROJECT }}",
                    "--no-jumptables", "--heal-iters", "${{ inputs.heal_iters }}", "--publish-gabarito",
                    "--from", "setjmp")
          if ("${{ inputs.runheal }}" -ne "true") { $args += @("--until", "build") }
          python rexauto.py @args 2>&1 | Tee-Object -FilePath "$env:REXAUTO_WORK\${{ env.REX_PROJECT }}\_pipeline.log"
          exit $LASTEXITCODE

      - name: Localize generated code (register-as-local flush)
        shell: pwsh
        timeout-minutes: 15
        run: |
          # tools/localize_fix_col.py runs on the GENERATED tree (after
          # codegen converged, before the pack step). It adds the cross-call
          # flush/copy-back that register-as-local needs: without it a
          # callee reads stale ctx.<reg> where its caller set a local.
          # The script is adapted to the SDK syntax (DEFINE_REX_FUNC /
          # REX_CALL_INDIRECT_FUNC / REX_FUNC_PROLOGUE, ronda 2 A P1-1)
          # and the glob below is childoflight_recomp.*.cpp (the SDK emits
          # {project}_recomp.{N}.cpp). The next step ("Verify
          # register-as-local codegen + localize") FAILS the job when 0
          # LOCALIZE_FIX markers are found, instead of shipping
          # un-localized code silently. Do NOT delete that tripwire: if it
          # fires, the localize pass ran but transformed nothing -- check
          # the manifest injection, the codegen output and the glob first.
          $gen = "$env:REXAUTO_WORK\${{ env.REX_PROJECT }}\port\generated\default"
          python "$env:GITHUB_WORKSPACE\tools\localize_fix_col.py" "$gen\childoflight_recomp.*.cpp"
          exit $LASTEXITCODE

      - name: Verify register-as-local codegen + localize
        shell: pwsh
        timeout-minutes: 10
        run: |
          # Replaces the old "Guard: patched codegen required" step. That
          # guard checked recomp/col.toml, a file CI never consumes; this
          # one checks the three things that prove the wiring ran:
          #  (1) the manifest still carries the 5 injected keys = true
          #      (non_volatile_as_local removed by Alice T1: it is NOT
          #      injected anymore, so the SDK default applies);
          #  (2) the SDK codegen honored them (the generated *_init.cpp
          #      carries the flags as struct fields, init_cpp.inja);
          #  (3) the localize pass actually transformed the generated code
          #      (LOCALIZE_FIX markers) -- the tripwire for the TODO above.
          $port = "$env:REXAUTO_WORK\${{ env.REX_PROJECT }}\port"
          $manifest = Join-Path $port "${{ env.REX_PROJECT }}_manifest.toml"
          $gen = Join-Path $port "generated\default"
          $flagNames = @("ctr_as_local","xer_as_local","reserved_as_local","cr_as_local","non_argument_as_local")
          foreach ($k in $flagNames) {
            if ((Select-String -Path $manifest -Pattern "^\s*$k\s*=\s*true\s*$").Count -ne 1) { Write-Host "::error::manifest lost $k = true -- the injection did not survive"; exit 1 }
          }
          $initCpp = Join-Path $gen "${{ env.REX_PROJECT }}_init.cpp"
          if (-not (Test-Path $initCpp)) { Write-Host "::error::generated init file missing: $initCpp (expected <project>_init.cpp in generated/default)"; exit 1 }
          foreach ($k in $flagNames) {
            if ((Select-String -Path $initCpp -Pattern "\.$k\s*=\s*true").Count -lt 1) { Write-Host "::error::generated init file does not show .$k = true -- the SDK codegen ignored the manifest"; exit 1 }
          }
          $marks = (Get-ChildItem $gen -Filter "childoflight_recomp.*.cpp" | Select-String -Pattern "LOCALIZE_FIX").Count
          if (-not $marks) {
            Write-Host "::error::0 LOCALIZE_FIX markers in the generated tree: tools/localize_fix_col.py ran but transformed nothing (it is already adapted to the SDK syntax, DEFINE_REX_FUNC / REX_CALL_INDIRECT_FUNC -- check the manifest injection, the codegen output and the childoflight_recomp.*.cpp glob first). Do not ship as_local=true code without the localize pass (callees would read stale registers)."
            exit 1
          }
          Write-Host "register-as-local verified: manifest keys + generated init flags + $marks LOCALIZE_FIX markers"

      - name: Guard R14 crash (null +156) -- ronda 15 A2-R15-01
        shell: pwsh
        timeout-minutes: 10
        run: |
          # tools/guard_r15_col.py runs on the GENERATED tree, right after
          # the localize pass and before the pack step. It guards the two
          # unchecked uses of *(this+156) that crash R14 deterministically
          # at JUGAR (SIGSEGV base+4, guest NULL in sub_82459F10): the
          # state-2 handler sub_824C5150 and the state-4 branch of
          # sub_824C4B70. The guard recreates the sub-object exactly as
          # sub_824C4FD8 would (Alloc(60,66) + Ctor sub_8242EAC8) and, if
          # the Alloc fails again, skips the block without crashing (ronda
          # 18, A2-R18-02: sub_824C5150 is the state-3 once-hook, not the
          # state-2 per-frame function -- the skip re-arms its once-flag
          # so it retries next frame). The script FAILS the job when an anchor
          # does not match verbatim, so a codegen change cannot silently
          # ship unguarded code. The marker count below is the per-file
          # tripwire that the guard actually landed in the packed tree:
          # childoflight_recomp.90.cpp carries 3 markers (the DECLARE line
          # + 2 guard comments in sub_824C5150: the +156 explanation and
          # the r3-restore note) and childoflight_recomp.46.cpp carries 2
          # (the DECLARE line + 1 guard comment in sub_824C4B70) -- 5 in
          # total. Counted per file, not globally: a global >= 4 would also
          # pass if a future script change moved markers between files,
          # and the old comment ("2 per guarded file") was wrong for
          # .90.cpp. (Ronda 16, A5-R16-02.) (Ronda 17, A2-R17-01/A2-R17-02:
          # the same nullable +156 field is used unchecked in 9 more
          # sites, so the guard now covers 8 more files -- .32.cpp carries
          # 3 (DECLARE + 2 guard comments in sub_824C4D70, same `this`)
          # and each of .129/.86/.136/.184/.128/.98/.50.cpp carries 2
          # (DECLARE + 1 guard comment: sub_824C8940, sub_824C8018,
          # sub_824C9A60, sub_82A60450, sub_824C9DA8, sub_82A60C40,
          # sub_824C99D8) -- 22 markers in total, still per file.)
          # (Ronda 19, A2-R19-01: the state-2 once-hook sub_824C52F8 passes
          # the same +156 to sub_82459F10 through the wrapper sub_82488668,
          # so the guard covers 1 more file -- .99.cpp carries 2 (DECLARE +
          # 1 guard comment) -- 24 markers in total, still per file.)
          $gen = "$env:REXAUTO_WORK\${{ env.REX_PROJECT }}\port\generated\default"
          python "$env:GITHUB_WORKSPACE\tools\guard_r15_col.py" "$gen\childoflight_recomp.*.cpp"
          $guardRc = $LASTEXITCODE
          $marks90 = @(Select-String -Path "$gen\childoflight_recomp.90.cpp" -Pattern "GUARD_R15_A2-R15-01").Count
          $marks46 = @(Select-String -Path "$gen\childoflight_recomp.46.cpp" -Pattern "GUARD_R15_A2-R15-01").Count
          $marks32 = @(Select-String -Path "$gen\childoflight_recomp.32.cpp" -Pattern "GUARD_R15_A2-R15-01").Count
          $marks129 = @(Select-String -Path "$gen\childoflight_recomp.129.cpp" -Pattern "GUARD_R15_A2-R15-01").Count
          $marks86 = @(Select-String -Path "$gen\childoflight_recomp.86.cpp" -Pattern "GUARD_R15_A2-R15-01").Count
          $marks136 = @(Select-String -Path "$gen\childoflight_recomp.136.cpp" -Pattern "GUARD_R15_A2-R15-01").Count
          $marks184 = @(Select-String -Path "$gen\childoflight_recomp.184.cpp" -Pattern "GUARD_R15_A2-R15-01").Count
          $marks128 = @(Select-String -Path "$gen\childoflight_recomp.128.cpp" -Pattern "GUARD_R15_A2-R15-01").Count
          $marks98 = @(Select-String -Path "$gen\childoflight_recomp.98.cpp" -Pattern "GUARD_R15_A2-R15-01").Count
          $marks50 = @(Select-String -Path "$gen\childoflight_recomp.50.cpp" -Pattern "GUARD_R15_A2-R15-01").Count
          $marks99 = @(Select-String -Path "$gen\childoflight_recomp.99.cpp" -Pattern "GUARD_R15_A2-R15-01").Count
          if ($guardRc -ne 0) { exit $guardRc }
          if (-not $marks90 -or $marks90 -lt 3 -or -not $marks46 -or $marks46 -lt 2 -or -not $marks32 -or $marks32 -lt 3 -or -not $marks129 -or $marks129 -lt 2 -or -not $marks86 -or $marks86 -lt 2 -or -not $marks136 -or $marks136 -lt 2 -or -not $marks184 -or $marks184 -lt 2 -or -not $marks128 -or $marks128 -lt 2 -or -not $marks98 -or $marks98 -lt 2 -or -not $marks50 -or $marks50 -lt 2 -or -not $marks99 -or $marks99 -lt 2) { Write-Host "::error::guard_r15_col ran but the guard did not land per file: $marks90 GUARD_R15 markers in childoflight_recomp.90.cpp (expected >= 3: DECLARE + 2 guard comments, sub_824C5150), $marks46 in childoflight_recomp.46.cpp (expected >= 2: DECLARE + 1 guard comment, sub_824C4B70), $marks32 in childoflight_recomp.32.cpp (expected >= 3: DECLARE + 2 guard comments, sub_824C4D70), $marks129 in .129.cpp, $marks86 in .86.cpp, $marks136 in .136.cpp, $marks184 in .184.cpp, $marks128 in .128.cpp, $marks98 in .98.cpp, $marks50 in .50.cpp (each expected >= 2: DECLARE + 1 guard comment), $marks99 in .99.cpp (expected >= 2: DECLARE + 1 guard comment, sub_824C52F8)"; exit 1 }
          Write-Host "crash guard verified: $marks90 GUARD_R15 markers in .90.cpp (sub_824C5150) + $marks46 in .46.cpp (sub_824C4B70) + $marks32 in .32.cpp (sub_824C4D70) + $marks129 in .129.cpp (sub_824C8940) + $marks86 in .86.cpp (sub_824C8018) + $marks136 in .136.cpp (sub_824C9A60) + $marks184 in .184.cpp (sub_82A60450) + $marks128 in .128.cpp (sub_824C9DA8) + $marks98 in .98.cpp (sub_82A60C40) + $marks50 in .50.cpp (sub_824C99D8) + $marks99 in .99.cpp (sub_824C52F8)"

      - name: Title metadata (name, Title ID, cover)
        id: meta
        if: always()
        shell: pwsh
        timeout-minutes: 10
        working-directory: rexauto
        run: |
          $game = "$env:REXAUTO_WORK\${{ env.REX_PROJECT }}\game"
          $xex = Get-ChildItem $game -Recurse -Filter default.xex -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($xex) { python tools/title_meta.py "$($xex.FullName)" "${{ runner.temp }}\meta" }
          else { python tools/title_meta.py "${{ steps.fetch.outputs.container }}" "${{ runner.temp }}\meta" }

      - name: Pack generated port for the APK job
        if: always()
        shell: pwsh
        timeout-minutes: 15
        run: |
          $port = "$env:REXAUTO_WORK\${{ env.REX_PROJECT }}\port"
          if (-not (Test-Path "$port\generated\default\sources.cmake")) { Write-Host "::error::no generated code -- codegen failed, see logs"; exit 1 }
          # (Hunt v1.4.6, ronda 13, A5-R13-07.) Also prove src/ is
          # there before zipping: Copy-Item errors are NON-terminating
          # in pwsh, so a missing $port\src would NOT fail this step --
          # the zip would ship without src/ and only job 2 ("Unpack
          # port", test -f .../src/main.cpp) would catch it, a whole job
          # later. This step runs with if: always(), so it must verify
          # every input it zips, not just sources.cmake.
          if (-not (Test-Path "$port\src\main.cpp")) { Write-Host "::error::no port src -- $port\src\main.cpp is missing, refusing to pack a port-src.zip without sources"; exit 1 }
          $out = "${{ runner.temp }}\port-src"
          New-Item -ItemType Directory -Force $out | Out-Null
          # generated/ + src/ + *.toml -- NOT the build tree
          Copy-Item -Recurse "$port\generated" "$out\generated"
          Copy-Item -Recurse "$port\src" "$out\src"
          Get-ChildItem $port -File -Filter *.toml | Copy-Item -Destination $out
          Get-ChildItem $port -File -Filter *.cmake -ErrorAction SilentlyContinue | Copy-Item -Destination $out
          # (Hunt v1.4.6, ronda 14, A5-R14-02.) The checks above prove the
          # SOURCE inputs exist, not that the COPIES landed: Copy-Item
          # errors are NON-terminating, so a failed copy (disk full,
          # locked file) used to ship a port-src.zip missing generated/
          # entries, src/ files or *.toml -- and job 2 ("Unpack port")
          # only tests src/main.cpp + sources.cmake, so a partial
          # generated/ would surface only at Gradle/CMake time, a job
          # later, with a confusing error. Verify the copies, not just
          # the sources. (*.toml is not a job-2 build input -- nothing
          # in the app tree reads it -- but it is documented pack cargo
          # and the source artifact must carry it.)
          if (-not (Test-Path "$out\generated\default\sources.cmake")) { Write-Host "::error::pack copy failed: $out\generated\default\sources.cmake is missing after Copy-Item"; exit 1 }
          if (-not (Test-Path "$out\src\main.cpp")) { Write-Host "::error::pack copy failed: $out\src\main.cpp is missing after Copy-Item"; exit 1 }
          $genIn = @(Get-ChildItem "$port\generated" -Recurse -File).Count
          $genOut = @(Get-ChildItem "$out\generated" -Recurse -File).Count
          if ($genOut -ne $genIn) { Write-Host "::error::pack copy failed: $genOut of $genIn files under generated/ reached $out"; exit 1 }
          $tomlIn = @(Get-ChildItem $port -File -Filter *.toml).Count
          $tomlOut = @(Get-ChildItem $out -File -Filter *.toml).Count
          if ($tomlOut -ne $tomlIn) { Write-Host "::error::pack copy failed: $tomlOut of $tomlIn *.toml files reached $out"; exit 1 }
          # (Hunt v1.4.6, ronda 20, A5-R20-02.) Same hole A5-R14-02
          # closed for generated/ and *.toml, one cargo short: src/ was
          # only proven by test -f src/main.cpp, so a failed Copy-Item
          # of another src/ file shipped a partial port-src.zip -- and
          # job 2 ("Unpack port") also only tests src/main.cpp, so the
          # loss surfaced only at CMake compile, a job later, with a
          # confusing error. (The R14-02 comment above already names
          # "src/ files" among the cargos a failed copy could lose; no
          # count ever enforced it.) src/ has 4 files (main.cpp +
          # childoflight_app.h, included by main.cpp, + childoflight.ico
          # + childoflight.rc); count them like the other two cargos.
          # No hardcoded 4: the check compares source vs copy, so it
          # holds whatever the init stage authors.
          $srcIn = @(Get-ChildItem "$port\src" -Recurse -File).Count
          $srcOut = @(Get-ChildItem "$out\src" -Recurse -File).Count
          if ($srcOut -ne $srcIn) { Write-Host "::error::pack copy failed: $srcOut of $srcIn files under src/ reached $out"; exit 1 }
          # sources.cmake is ${CMAKE_CURRENT_LIST_DIR}-relative -> relocatable as-is
          Compress-Archive -Path "$out\*" -DestinationPath "${{ runner.temp }}\port-src.zip" -Force
          Copy-Item "${{ runner.temp }}\meta\cover.png" "${{ runner.temp }}\cover.png" -ErrorAction SilentlyContinue

      # (Hunt v1.4.6, ronda 16, A5-R16-03.) NO if: always() on this step on
      # purpose. The Pack step above runs with if: always() for
      # diagnostics, so on a failed guard step it still produces a
      # port-src.zip -- but that zip would carry an UNGUARDED tree, and
      # uploading it as an artifact of a red run invites consuming it by
      # hand. The artifact is only uploaded when every prior step
      # (including the guard + tripwire) succeeded; the run is red
      # otherwise and the apk job is skipped via needs: recompile.
      # (Upload logs below keeps if: always(): logs are diagnostics,
      # not a build input.)
      - uses: actions/upload-artifact@v7
        timeout-minutes: 15
        with:
          name: port-src-${{ env.REX_PROJECT }}
          path: |
            ${{ runner.temp }}/port-src.zip
            ${{ runner.temp }}/cover.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        timeout-minutes: 10
        with:
          name: logs-windows-${{ env.REX_PROJECT }}
          path: |
            ${{ env.REXAUTO_WORK }}/${{ env.REX_PROJECT }}/*.log
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------- apk
  apk:
    name: "APK (arm64-v8a)"
    needs: recompile
    runs-on: ubuntu-24.04
    # (A5-R8-06, ronda 8.) Same treatment R7-11 gave job 1: every step
    # in this job now carries its own timeout-minutes (the 6 steps that
    # already had one sum to 240; the 19 new ones sum to 350, for 590 in
    # total). The two steps with real variance -- the Gradle cache restore
    # (potentially GBs) and the ~1.6 GB APK upload -- get generous caps
    # (60 each); the rest get attribution caps of 5-30 min. Step timeouts
    # are per-step ATTRIBUTION caps, NOT an additive budget: their sum
    # (590) exceeds the job ceiling (300) by design -- the job timeout is
    # still the hard ceiling, and a step cap only fires when that single
    # step hangs past its own cap, so the failure names the hanging step
    # instead of dying anonymously at the job timeout.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10

      - name: Checkout rexauto (pinned commit)
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          repository: Player124413/rexauto
          ref: ${{ env.REXAUTO_REF }}
          path: rexauto

      - name: Overlay our port tree onto rexauto
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # This repo is a DELTA on rexauto@dac49b33: only the files we
          # changed or added live here. Without this step the Gradle below
          # would build the STOCK rexauto launcher + stock SDK (no Mali
          # patch, no super.onCreate fix, no Spanish, no input pulse) --
          # P0-1, hunt round 2 (2026-11-13). The copy is safe: in CI this
          # checkout holds exactly the tracked files (sdk/, build/,
          # .gradle/, ci-release.jks, local.properties are gitignored).
          # (A5-R7-05, ronda 7.) CORRECTION: the old comment claimed
          # settings.gradle.kts is not tracked and the stock one stays --
          # FALSE. settings.gradle.kts IS tracked and IS overlaid here
          # (same for gradle.properties). Both are inert in CI per
          # evidence R-01/R-02: the file:// local-maven repo points at a
          # directory that does not exist on the runner (Gradle treats it
          # as an empty repo and resolves via google()/mavenCentral()),
          # and the MITM truststore path does not exist either (the JVM
          # falls back to the default cacerts). If either ever stops being
          # inert, this is the place that ships it to CI.
          cp -r tools/rexauto/android/. rexauto/android/
          cp tools/rexauto/tools/android_sdk.sh rexauto/tools/android_sdk.sh
          # Sanity: the files that must differ from stock are present.
          test -f rexauto/android/app/src/main/java/com/rexauto/port/gamepad/VirtualPadView.java
          # (Ronda 4, G-F2.) The M1 app files CMake compiles into libmain.so:
          # without them Gradle fails minutes later instead of here.
          test -f rexauto/android/app/src/main/cpp/col_main.cpp
          test -f rexauto/android/app/src/main/cpp/col_dlc_installer.cpp
          test -f rexauto/android/app/src/main/cpp/stfs_asset_jni.cpp
          grep -q "mali-vertex-stores" rexauto/tools/android_sdk.sh
          grep -q 'vulkan_async_skip_incomplete_frames", "false"' rexauto/android/app/src/main/java/com/rexauto/port/GraphicsSettings.java

      - name: Free disk space + swap (runners have ~14 GB SSD)
        timeout-minutes: 20
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          # (J-5.) 16G used to be fatal if free disk dipped below it. Show
          # the disk first, fall back to 8G, and continue without swap (with
          # a warning) if even that fails -- a missing swapfile must not kill
          # the job before compiling.
          df -h
          if sudo fallocate -l 16G /swapfile 2>/dev/null; then
            echo "swapfile 16G"
          elif sudo rm -f /swapfile && sudo fallocate -l 8G /swapfile 2>/dev/null; then
            echo "::warning::16G swapfile did not fit, using 8G fallback"
          else
            echo "::warning::could not allocate a swapfile, continuing without swap"
          fi
          if [ -f /swapfile ]; then
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          docker image prune -af 2>/dev/null || true
          sudo apt-get clean
          df -h
          free -h

      - uses: actions/download-artifact@v8
        timeout-minutes: 30
        with:
          name: port-src-${{ env.REX_PROJECT }}
          path: ${{ runner.temp }}/in

      - name: Unpack port
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p autoports/${{ env.REX_PROJECT }}/port
          unzip -q "${{ runner.temp }}/in/port-src.zip" -d autoports/${{ env.REX_PROJECT }}/port
          ls autoports/${{ env.REX_PROJECT }}/port
          # (Hunt v1.4.6, ronda 13, A5-R13-06.) The old
          # `find ... | sed -n '1,12p'` carried the same SIGPIPE hazard
          # the step used to warn about for `ls | head`: once the
          # listing exceeds the 64 KB pipe buffer, sed exits after 12
          # lines, find dies with SIGPIPE (141) and pipefail fails the
          # step -- a false red that grows more likely as the generated
          # tree gains files. Same fix as M-13b: dump to a file first,
          # then read the file.
          find autoports/${{ env.REX_PROJECT }}/port/generated/default -maxdepth 1 > /tmp/port-files.txt
          sed -n '1,12p' /tmp/port-files.txt
          test -f autoports/${{ env.REX_PROJECT }}/port/src/main.cpp
          sed -n '1,8p' autoports/${{ env.REX_PROJECT }}/port/generated/default/sources.cmake

      - name: Host toolchain
        timeout-minutes: 30
        run: |
          # (J-1.) A transient apt failure used to kill the whole job 2.
          # Retry the update+install pair 3 times with 30 s between tries.
          for i in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y ninja-build libx11-xcb-dev libwayland-dev libwayland-client0 unzip zip; then
              echo "apt OK (attempt $i)"
              break
            fi
            echo "::warning::apt attempt $i failed"
            if [ "$i" = "3" ]; then echo "::error::apt-get failed after 3 attempts"; exit 1; fi
            sleep 30
          done

      - uses: actions/setup-java@v6
        timeout-minutes: 10
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache patched ReXGlue SDK
        uses: actions/cache@v6
        timeout-minutes: 30
        id: sdk-cache
        with:
          path: rexauto/android/sdk
          # (A5-R7-06, ronda 7.) The key carries the xbmovie_probe input:
          # the flip step below edits xbmovie_device.cpp INSIDE this
          # cached tree, so a probe=true run used to save the flipped SDK
          # under the same key as a normal run (only the unconditional
          # re-overlay + the M-5 guard saved normal runs). inputs
          # .xbmovie_probe is a workflow boolean (default false).
          key: android-sdk-v0.10.0-${{ hashFiles('rexauto/android/patches/*.patch', 'rexauto/tools/android_sdk.sh', 'tools/rexauto/android/patches/*.patch', 'tools/rexauto/tools/android_sdk.sh', 'tools/rexauto/android/sdk/**') }}-probe-${{ inputs.xbmovie_probe }}

      - name: ReXGlue SDK (v0.10.0 + Android patches)
        working-directory: rexauto
        timeout-minutes: 30
        run: tools/android_sdk.sh

      - name: Re-overlay tracked SDK files (after SDK setup)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # android_sdk.sh rm -rf's the SDK dir and rebuilds it from patches
          # only. The tracked SDK files (STFS support, the xbmovie probe
          # device, WaitMultiple, mprotect...) and the hand edits they carry
          # are NOT produced by any patch — a cache-miss build would lose
          # them without this step (assemble test, 2026-11-13). Tracked
          # files win over patches by design. (No file count here: it went
          # stale every round -- ronda 3 G-N6.)
          cp -r tools/rexauto/android/sdk/. rexauto/android/sdk/
          test -f rexauto/android/sdk/rexglue-sdk/src/filesystem/devices/stfs_data_file.cpp
          test -f rexauto/android/sdk/rexglue-sdk/src/filesystem/stfs_asset_source.cpp
          # (Ronda 4, G-F2.) The xbmovie probe device (ronda 2, C-1/C-2):
          # same early failure as the STFS files above if it goes missing.
          test -f rexauto/android/sdk/rexglue-sdk/src/filesystem/devices/xbmovie_device.cpp
          test -f rexauto/android/sdk/rexglue-sdk/src/filesystem/devices/xbmovie_entry.cpp
          test -f rexauto/android/sdk/rexglue-sdk/src/filesystem/devices/xbmovie_file.cpp
          # (Ronda 4, A4-R4-01.) SDLActivity.java is a tracked overlay file,
          # but android_sdk.sh re-stages the STOCK SDL3 Java glue over
          # rexauto/android/app/src/main/java/org/libsdl/app/ AFTER the
          # port-tree overlay (cp *.java) — without this line every build
          # would silently lose the onDestroy fix. Tracked file wins over
          # the stock glue by design, same as the SDK files above.
          cp tools/rexauto/android/app/src/main/java/org/libsdl/app/SDLActivity.java rexauto/android/app/src/main/java/org/libsdl/app/SDLActivity.java
          test -f rexauto/android/app/src/main/java/org/libsdl/app/SDLActivity.java
          # (Hunt v1.4.6, ronda 12, A5-R12-01.) android_sdk.sh re-stages
          # the STOCK SDL3 Java glue over org/libsdl/app/ (cp *.java), so
          # it clobbers not just SDLActivity.java but also the other five
          # tracked SDL files -- and the re-overlay above restored ONLY
          # SDLActivity. Every CI build since the R9 GATT fixes silently
          # shipped the STOCK HIDDeviceBLESteamController (no GATT fixes
          # A4-R9-03/04/05/06) and the STOCK HIDDeviceManager /
          # SDLControllerManager / SDLSurface (no R11 fixes A4-R11-02/05/
          # 06) and the STOCK SDLAudioManager (no R12 null-guard
          # A4-R12-02), while the FULL script gates the same files by
          # marker and fails loudly. Restore all five here, and grep each
          # marker (the stock glue does not carry them): a cp restores
          # the tracked file as-is, so only the marker proves the
          # tracked file itself still carries its fix.
          # (Parent amendment: SDLAudioManager.java becomes tracked in
          # this same R12 batch, so it needs the same restore + gate --
          # otherwise run #33 would ship it stock, the same ALTO bug
          # one file short.)
          cp tools/rexauto/android/app/src/main/java/org/libsdl/app/HIDDeviceBLESteamController.java rexauto/android/app/src/main/java/org/libsdl/app/HIDDeviceBLESteamController.java
          cp tools/rexauto/android/app/src/main/java/org/libsdl/app/HIDDeviceManager.java rexauto/android/app/src/main/java/org/libsdl/app/HIDDeviceManager.java
          cp tools/rexauto/android/app/src/main/java/org/libsdl/app/SDLControllerManager.java rexauto/android/app/src/main/java/org/libsdl/app/SDLControllerManager.java
          cp tools/rexauto/android/app/src/main/java/org/libsdl/app/SDLSurface.java rexauto/android/app/src/main/java/org/libsdl/app/SDLSurface.java
          cp tools/rexauto/android/app/src/main/java/org/libsdl/app/SDLAudioManager.java rexauto/android/app/src/main/java/org/libsdl/app/SDLAudioManager.java
          # (Hunt v1.4.6, ronda 20, A4-R20-04b, enmienda del coordinador.)
          # HIDDeviceUSB.java becomes tracked in this same round (A4-R20-04:
          # null/empty guard in writeReport/readReport). Without this line
          # android_sdk.sh would stage the STOCK SDL3 glue over the new
          # tracked file and the fix would never reach the APK -- same
          # pattern as SDLAudioManager in R12 (A5-R12-01).
          cp tools/rexauto/android/app/src/main/java/org/libsdl/app/HIDDeviceUSB.java rexauto/android/app/src/main/java/org/libsdl/app/HIDDeviceUSB.java
          test -f rexauto/android/app/src/main/java/org/libsdl/app/HIDDeviceBLESteamController.java
          test -f rexauto/android/app/src/main/java/org/libsdl/app/HIDDeviceManager.java
          test -f rexauto/android/app/src/main/java/org/libsdl/app/SDLControllerManager.java
          test -f rexauto/android/app/src/main/java/org/libsdl/app/SDLSurface.java
          test -f rexauto/android/app/src/main/java/org/libsdl/app/SDLAudioManager.java
          test -f rexauto/android/app/src/main/java/org/libsdl/app/HIDDeviceUSB.java
          grep -q "Hunt v1.4.6 ronda 4, A4-R4-01" rexauto/android/app/src/main/java/org/libsdl/app/SDLActivity.java || { echo "::error::SDLActivity.java lost the onDestroy fix (A4-R4-01) -- the tracked file no longer carries it"; exit 1; }
          grep -q "Hunt v1.4.6 ronda 9, A4-R9-04" rexauto/android/app/src/main/java/org/libsdl/app/HIDDeviceBLESteamController.java || { echo "::error::HIDDeviceBLESteamController.java lost the GATT fixes (A4-R9-03/04/05/06) -- the tracked file no longer carries them"; exit 1; }
          grep -q "Hunt v1.4.6 ronda 11, A4-R11-02" rexauto/android/app/src/main/java/org/libsdl/app/HIDDeviceManager.java || { echo "::error::HIDDeviceManager.java lost the USB-handler fix (A4-R11-02) -- the tracked file no longer carries it"; exit 1; }
          grep -q "Hunt v1.4.6 ronda 11, A4-R11-05" rexauto/android/app/src/main/java/org/libsdl/app/SDLControllerManager.java || { echo "::error::SDLControllerManager.java lost the pollInputDevices null-guard (A4-R11-05) -- the tracked file no longer carries it"; exit 1; }
          grep -q "Hunt v1.4.6 ronda 11, A4-R11-06" rexauto/android/app/src/main/java/org/libsdl/app/SDLSurface.java || { echo "::error::SDLSurface.java lost the enableSensor null-guard (A4-R11-06) -- the tracked file no longer carries it"; exit 1; }
          grep -q "Hunt v1.4.6 ronda 12, A4-R12-02" rexauto/android/app/src/main/java/org/libsdl/app/SDLAudioManager.java || { echo "::error::SDLAudioManager.java lost the getProductName null-guard (A4-R12-02) -- the tracked file no longer carries it"; exit 1; }
          grep -q "Hunt v1.4.6 ronda 20, A4-R20-04" rexauto/android/app/src/main/java/org/libsdl/app/HIDDeviceUSB.java || { echo "::error::HIDDeviceUSB.java lost the null/empty guard (A4-R20-04) -- the tracked file no longer carries it"; exit 1; }

      - name: Guard tracked SDK files carry their patch hunks (M-5)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # (M-5.) Patches and tracked SDK files are two sources of truth:
          # android_sdk.sh rebuilds the SDK from patches only, and this
          # re-overlay then overwrites 6 files with the tracked versions.
          # Today the tracked files already contain the patch hunks (verified
          # 2026-11-19: each marker below is an added line of its .patch AND
          # is present exactly once in the tracked file), but nothing enforced
          # it: if a tracked file were deleted or regenerated from a pristine
          # tree, the build would silently lose the Mali / perf / DLC fixes.
          # Each marker is a string only the patch adds (not upstream).
          # xbmovie_device.cpp MUST stay tracked: a run with
          # xbmovie_probe=true caches the SDK with the probe already flipped,
          # and only the re-overlay restores the default false.
          SDK=rexauto/android/sdk/rexglue-sdk
          check() { # check <file> <marker> <patch>
            if ! grep -q -F "$2" "$SDK/$1"; then
              echo "::error::M-5 guard: $1 lost its $3 hunk (missing: $2) -- the tracked file no longer carries the patch; fix the tracked file or regenerate the patch from it, do not ship a silently older SDK"
              exit 1
            fi
          }
          check src/ui/vulkan/vulkan_device.cpp 'REXCVAR_DEFINE_BOOL(vulkan_require_vertex_pipeline_stores_and_atomics, false,' 'mali-vertex-stores'
          check src/graphics/vulkan/command_processor.cpp 'REXCVAR_GET(vulkan_require_vertex_pipeline_stores_and_atomics)' 'mali-vertex-stores'
          check src/core/memory_posix.cpp 'Cached /proc/self/maps snapshot for the exception fast path' 'android-perf'
          check src/graphics/command_processor.cpp 'We spin briefly here waiting for new ones' 'android-perf'
          check src/graphics/vulkan/texture_cache.cpp 'auto log_bc_fallback' 'android-perf'
          check src/system/xam/content_manager.cpp 'Hunt 2 DLC, P1-3' 'dlc-extract-errors'
          check src/filesystem/devices/xbmovie_device.cpp 'REXCVAR_DEFINE_BOOL(xbmovie_probe, false,' 'tracked-only (probe default; the flip step below depends on it)'
          echo "M-5 guard OK: 6 patched files + xbmovie_device.cpp carry their hunks"

      - name: Enable xbmovie_probe for this run (if requested)
        timeout-minutes: 5
        if: inputs.xbmovie_probe
        run: |
          set -euo pipefail
          # Run #9 experiment (blackscreen-diagnosis.md §6.3, expert-sweep.md
          # §8.1.3): the guest may be waiting for the end of the logo movie,
          # and the xbmovie: device does not exist, so the open fails. With
          # the probe on, the open succeeds and reads return EOF at once, so
          # the movie "ends" immediately. Only the default in the overlaid
          # SDK copy (the file CMake compiles) is flipped, only when the
          # workflow input is true; the tracked file keeps default false.
          # Reversible by design: the next run without the input rebuilds
          # from the tracked default.
          f="rexauto/android/sdk/rexglue-sdk/src/filesystem/devices/xbmovie_device.cpp"
          test -f "$f"
          # (Hunt v1.4.6, ronda 12, A5-R12-03.) grep -c exits 1 on 0
          # matches, and under set -euo pipefail that kills the step with
          # a bare exit 1 before the [ "$n" != "1" ] check below can print
          # its ::error:: -- the same pattern the FULL script guards with
          # `|| true` (or an explicit -q check) everywhere. `|| true`
          # inside the substitution lets n="0" through to the check.
          n="$(grep -c 'REXCVAR_DEFINE_BOOL(xbmovie_probe, false,' "$f" || true)"
          if [ "$n" != "1" ]; then echo "::error::xbmovie_probe default pattern found $n times (want 1)"; exit 1; fi
          sed -i 's/REXCVAR_DEFINE_BOOL(xbmovie_probe, false,/REXCVAR_DEFINE_BOOL(xbmovie_probe, true,/' "$f"
          # (Hunt v1.4.6, ronda 13, A5-R13-08.) The old `grep -n` below
          # only PRINTED the line: it matches the false default too, so
          # a sed that silently substituted nothing (GNU sed exits 0 on
          # no match) passed the step with the probe still off. Assert
          # the flipped value instead -- the pre-check above proves the
          # false literal exists exactly once, so this can only fail if
          # the flip itself did not happen.
          grep -q 'REXCVAR_DEFINE_BOOL(xbmovie_probe, true,' "$f" || { echo "::error::xbmovie_probe flip failed: the default is not true in $f after sed"; exit 1; }
          grep -n 'REXCVAR_DEFINE_BOOL(xbmovie_probe' "$f"
          echo "xbmovie_probe default set to true for this run (input xbmovie_probe=true)"

      - name: Cache Android CMake + NDK
        uses: actions/cache@v6
        timeout-minutes: 30
        with:
          # (M-4.) cmake 3.31.1 + NDK 27.2.12479018 were re-downloaded from
          # dl.google.com on every run. Fixed key: these versions are pinned
          # in the sdkmanager step below, so the cache only ever holds them.
          path: |
            ${{ env.ANDROID_HOME }}/cmake
            ${{ env.ANDROID_HOME }}/ndk
          key: android-ndk-cmake-${{ runner.os }}-3.31.1-27.2.12479018

      - name: Android CMake 3.31.1
        timeout-minutes: 30
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          # (M-4.) The old `>/dev/null` hid sdkmanager errors and there was
          # no retry: a transient dl.google.com failure killed the run with
          # no diagnosis. On a cache hit this is a fast no-op (already
          # installed); on failure the log is shown and the install retried.
          for i in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.1" "ndk;27.2.12479018" > /tmp/sdkmanager.log 2>&1; then
              echo "sdkmanager OK (attempt $i)"
              break
            fi
            echo "::warning::sdkmanager attempt $i failed"
            cat /tmp/sdkmanager.log
            if [ "$i" = "3" ]; then echo "::error::sdkmanager failed after 3 attempts"; exit 1; fi
            sleep 30
          done

      - name: Stage assets (title DB, cover, launcher icon)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p rexauto/android/app/src/main/assets
          cp rexauto/tools/xbox360_titles.json rexauto/android/app/src/main/assets/
          # (Hunt v1.4.6, ronda 19, A5-R19-07.) Install pillow ONCE, with
          # retry, before the branch below: both branches used to run
          # their own bare `pip install` with no retry, so a transient
          # PyPI failure killed the run here (after the ~25 min codegen
          # job) with no second chance -- every other network fetch in
          # this workflow retries (apt, sdkmanager, SDK install, game
          # input). One install serves both branches (android_icon.py
          # needs pillow in either case). Fails loudly after 3 attempts.
          for _i in 1 2 3; do
            if python3 -m pip install -q "pillow==13.0.0"; then
              echo "pip pillow OK (attempt $_i)"
              break
            fi
            echo "::warning::pip install pillow attempt $_i failed"
            if [ "$_i" = "3" ]; then echo "::error::pip install pillow failed after 3 attempts"; exit 1; fi
            sleep 10
          done
          if [ -f "${{ runner.temp }}/in/cover.png" ]; then
            cp "${{ runner.temp }}/in/cover.png" rexauto/android/app/src/main/assets/cover.png
            python3 rexauto/tools/android_icon.py "${{ runner.temp }}/in/cover.png" rexauto/android/app/src/main/res
          else
            # (Ronda 4, G-F4.) A missing cover used to fall through silently
            # to the generic rexauto icon. Warn so the log says why.
            echo "::warning::cover.png missing in port-src artifact -- the APK will use the generic rexauto icon"
            python3 rexauto/tools/android_icon.py rexauto/gui/rexauto_icon.png rexauto/android/app/src/main/res
          fi

      - name: CI signing key (stable, from secret if present)
        timeout-minutes: 10
        env:
          CI_KEYSTORE_BASE64: ${{ secrets.CI_KEYSTORE_BASE64 }}
          CI_KEYSTORE_STORE_PASSWORD: ${{ secrets.CI_KEYSTORE_STORE_PASSWORD }}
          CI_KEYSTORE_KEY_PASSWORD: ${{ secrets.CI_KEYSTORE_KEY_PASSWORD }}
          CI_KEYSTORE_KEY_ALIAS: ${{ secrets.CI_KEYSTORE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          cd rexauto/android
          if [ -n "${CI_KEYSTORE_BASE64:-}" ]; then
            echo "$CI_KEYSTORE_BASE64" | base64 -d > ci-release.jks
            echo "Using stable CI keystore from secret CI_KEYSTORE_BASE64."
            # P1-7 (ronda 2, auditor B): the keystore passwords come from the
            # new secrets CI_KEYSTORE_STORE_PASSWORD / CI_KEYSTORE_KEY_PASSWORD
            # (alias from CI_KEYSTORE_KEY_ALIAS, defaulting to the heart alias
            # when the secret is empty). build.gradle.kts reads them from the
            # environment at Gradle time -- no hardcoded password, no sed of
            # the alias anymore. The values are passed to the Gradle step via
            # GITHUB_ENV (a step-level env: here would overwrite them with
            # empty secrets when the fallback branch ran).
            if [ -z "${CI_KEYSTORE_STORE_PASSWORD:-}" ] || [ -z "${CI_KEYSTORE_KEY_PASSWORD:-}" ]; then
              echo "::error::CI_KEYSTORE_BASE64 is set but CI_KEYSTORE_STORE_PASSWORD / CI_KEYSTORE_KEY_PASSWORD are missing. Create the secrets (see docs/REXAUTo.md section 6) before running."
              exit 1
            fi
            {
              echo "CI_KEYSTORE_STORE_PASSWORD=$CI_KEYSTORE_STORE_PASSWORD"
              echo "CI_KEYSTORE_KEY_PASSWORD=$CI_KEYSTORE_KEY_PASSWORD"
              echo "CI_KEYSTORE_KEY_ALIAS=${CI_KEYSTORE_KEY_ALIAS:-childoflight<3}"
            } >> "$GITHUB_ENV"
            # (J-6.) Smoke-check the keystore NOW, not ~20 min later at the
            # Gradle signing step: -storepass is required or keytool prompts
            # and hangs. Also confirms the heart alias is present.
            keytool -list -keystore ci-release.jks -storepass "$CI_KEYSTORE_STORE_PASSWORD" -alias "${CI_KEYSTORE_KEY_ALIAS:-childoflight<3}" || { echo "::error::keystore smoke check failed: ci-release.jks is corrupt or does not contain alias '${CI_KEYSTORE_KEY_ALIAS:-childoflight<3}' -- check CI_KEYSTORE_BASE64 / CI_KEYSTORE_KEY_ALIAS"; exit 1; }
          else
            # (Ronda 3, auditor B, B-R3-1.) Sin CI_KEYSTORE_BASE64 NO se genera
            # un keystore fresco: la rama antigua lo generaba con contrasena
            # aleatoria y la APK salia firmada en verde (Verify solo comprueba
            # que la firma sea valida), pero con una llave distinta a la del
            # corazon: no instalaba encima de ninguna build anterior
            # (INSTALL_FAILED_UPDATE_INCOMPATIBLE) y el unico aviso era un
            # ::warning:: facil de pasar por alto. Este repo YA tiene builds
            # con la llave corazon en la calle (v1.1-v1.4.1), asi que un
            # keystore fresco nunca produce un artefacto utilizable: fallar
            # aqui, antes de gastar el build de Gradle. Un fork sin el
            # keystore corazon puede restaurar el bloque antiguo (keytool
            # -genkeypair + GITHUB_ENV) y quitar la comprobacion de huella
            # del paso "Verify APK".
            echo "::error::CI_KEYSTORE_BASE64 is not set: no stable keystore, refusing to sign with a fresh key. Create the secret (see docs/REXAUTo.md section 6) before running."
            exit 1
          fi

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        timeout-minutes: 60
        with:
          # (M-4.) Gradle 8.14 + AGP 8.7.3 + Kotlin + all Maven deps were
          # re-downloaded on every run. Keyed on the wrapper + build scripts,
          # so a Gradle/AGP change invalidates it. Restore-keys fall back to
          # the newest cache for this OS.
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('rexauto/android/gradle/wrapper/gradle-wrapper.properties', 'rexauto/android/build.gradle.kts', 'rexauto/android/app/build.gradle.kts', 'rexauto/android/settings.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Guard CI versionCode stays below the FULL range (A5-R4-01)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # (A5-R4-01, ronda 4.) CI versionCode is github.run_number and
          # FULL releases use 1_000_000 + major*10000 + minor*100 + patch
          # (v1.4.6 FULL = 1010406). Android orders updates by versionCode
          # only, so a CI run_number >= 1_000_000 would ship a CI APK that
          # no FULL release can update over (downgrade). Fail here, before
          # Gradle, if the run number ever reaches the FULL range. The CI
          # versionName stays "1.<run_number>" by design.
          # (A5-R7-08, ronda 7.) This guard is KEPT here as defense in
          # depth; the same check now also runs as the FIRST step of job 1
          # (fail-fast, before the ~3 h codegen) -- see there.
          if [ "${{ github.run_number }}" -ge 1000000 ]; then echo "::error::github.run_number ${{ github.run_number }} reached the FULL versionCode range (>= 1000000) -- CI codes must stay below 1_000_000; see the FULL versionCode scheme"; exit 1; fi
          echo "CI versionCode ${{ github.run_number }} < 1000000 (FULL range starts at 1000000)"

      - name: Gradle assembleRelease
        timeout-minutes: 120
        env:
          REX_TITLE: ${{ needs.recompile.outputs.title }}
          REX_TITLE_ID: ${{ needs.recompile.outputs.title_id }}
        run: |
          # P1-7: signing credentials (CI_KEYSTORE_STORE_PASSWORD /
          # CI_KEYSTORE_KEY_PASSWORD / CI_KEYSTORE_KEY_ALIAS) reach Gradle via
          # GITHUB_ENV, written by the "CI signing key" step above (from the
          # secrets). Do NOT add a step-level env: mapping here -- the values
          # come from GITHUB_ENV, and a mapping would only duplicate them.
          set -euo pipefail
          # Hunt 2, P2-6: un Title ID 00000000 (fallback) enmascararia que
          # title_meta.py no produjo nada; la APK rechazaría el juego.
          if [ -z "${REX_TITLE_ID:-}" ] || [ "$REX_TITLE_ID" = "00000000" ]; then echo "::error::REX_TITLE_ID is empty or 00000000 -- title_meta.py produced nothing"; exit 1; fi
          # (Hunt v1.4.6, ronda 20, A5-R20-03.) The check above only
          # proves title_meta.py produced SOMETHING nonzero: a wrong
          # nonzero Title ID (wrong ISO dispatched without iso_sha256,
          # or a misparse in title_meta.py, which swallows every data
          # error and degrades) shipped a CI APK that every gate passed
          # -- and the app refuses it at startup (StfsAsset.verifyUsable
          # reads the STFS header Title ID @0x360 and returns false on
          # mismatch; SetupActivity.checkXexTitle throws err_wrong_game).
          # The FULL hardcodes -PrexTitleId=5841140D, but nothing ever
          # compared CI's derived value against it. 5841140D is the
          # dump's own Title ID, read from the game STFS header @0x360
          # (method validated: the same read at @0x32C reproduces the
          # DLC_TABLE content IDs exactly, and the title DB maps
          # 5841140D to "Child of Light"). Require it here, before
          # Gradle, and require a real title, not the "Xbox 360 Game"
          # fallback title_meta.py degrades to (with the right Title ID
          # the DB lookup yields "Child of Light").
          if [ "$REX_TITLE_ID" != "5841140D" ]; then echo "::error::REX_TITLE_ID is $REX_TITLE_ID, expected 5841140D (Child of Light -- read from the game STFS header @0x360; the FULL hardcodes the same value). Wrong ISO dispatched, or title_meta.py misparsed the dump"; exit 1; fi
          if [ "${REX_TITLE:-}" = "Xbox 360 Game" ]; then echo "::error::REX_TITLE is the generic fallback 'Xbox 360 Game' -- title_meta.py produced no title (expected 'Child of Light' from the title DB)"; exit 1; fi
          if [ "${{ inputs.baseline_arm }}" = "true" ]; then export REX_ANDROID_BASELINE_ARM=1; fi
          cd rexauto/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PrexName="${{ env.REX_PROJECT }}" \
            -PrexTitle="${REX_TITLE:-${{ env.REX_PROJECT }}}" \
            -PrexTitleId="${REX_TITLE_ID:-00000000}" \
            -PrexPortDir="$GITHUB_WORKSPACE/autoports/${{ env.REX_PROJECT }}/port" \
            -PrexSdkDir="$GITHUB_WORKSPACE/rexauto/android/sdk/rexglue-sdk" \
            -PrexVersionCode="${{ github.run_number }}" \
            -PrexVersionName="1.${{ github.run_number }}"

      - name: Verify APK
        timeout-minutes: 15
        run: |
          set -euo pipefail
          APK=rexauto/android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" > /tmp/apk.txt
          # (Hunt v1.4.6, ronda 11, A5-R11-01.) All four greps below are
          # anchored with $: the patterns used to be unanchored, so a
          # stray "libmain.so.bak" / "librexgpu-xenos.so.bak" entry (or a
          # ".bak" adrenotools lib) matched and the gate stayed green
          # while the real .so was missing -- the same hole A5-R10-05
          # closed in the FULL script only. unzip -l puts the filename
          # at the end of the line, so $ is the right anchor.
          grep -q "lib/arm64-v8a/libmain.so$" /tmp/apk.txt || { echo "::error::libmain.so missing"; exit 1; }
          grep -Eq "lib/arm64-v8a/librexgpu-xenos\.so$" /tmp/apk.txt || { echo "::error::GPU plugin missing"; exit 1; }
          grep -q "assets/xbox360_titles.json$" /tmp/apk.txt || { echo "::error::title DB missing"; exit 1; }
          # (Ronda 4, auditor E — R4-E2.) Hard fail, not a warning: without
          # libadrenotools the loader compiles to a no-op (the app
          # CMakeLists only warns when the checkout is missing) and the
          # whole driver UI stays live but dead — import/select would
          # silently do nothing. All five .so files ship in the current APK
          # (the first two verified in the local Nov 13 build:
          # libadrenotools.so + libmain_hook.so), so this gate passes on a
          # healthy build and
          # only fires when the driver sources never reached the build
          # (the android_sdk.sh clone) or CMake skipped them.
          # (Ronda 5, auditor A — R5-A1.) The old message pointed at
          # "tools/rexauto/android/sdk/libadrenotools checkout": that path
          # is the repo tree, not where CI looks — in the apk job the
          # sources live at rexauto/android/sdk/libadrenotools, put there
          # by the 'ReXGlue SDK' step (tools/android_sdk.sh clones
          # bylaws/libadrenotools at the pinned rev); the repo checkout
          # does not carry them (nested .git, no .gitmodules at the root).
          # (A5-R4-10, ronda 4.) Check ALL FIVE adrenotools libs, not just
          # the first two: the app CMakeLists (app/src/main/cpp/CMakeLists.txt)
          # ships libadrenotools.so + libmain_hook.so + libhook_impl.so +
          # libfile_redirect_hook.so + libgsl_alloc_hook.so, and the driver
          # loader needs libhook_impl.so at runtime (hook_android_dlopen_ext).
          for _lib in libadrenotools.so libmain_hook.so libhook_impl.so libfile_redirect_hook.so libgsl_alloc_hook.so; do
            grep -q "lib/arm64-v8a/$_lib$" /tmp/apk.txt || { echo "::error::$_lib not packaged - custom GPU drivers will be unavailable (check the 'ReXGlue SDK' step: android_sdk.sh clones libadrenotools into rexauto/android/sdk/libadrenotools)"; exit 1; }
          done
          # (Hunt v1.4.6, ronda 10, A5-R10-01.) 16 KB page-size gate: on a
          # 16 KB-page device the dynamic loader rejects any .so whose
          # PT_LOAD p_align != 0x4000, and the app does not start at all.
          # The fix lives in app/src/main/cpp/CMakeLists.txt (linker flags
          # -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384 for
          # NDK r27); this gate verifies it in every CI APK. Do NOT
          # replace this with `zipalign -c -P 16`: the 9 .so are DEFLATED
          # (useLegacyPackaging=true) and compressed entries are exempt
          # from that check, so it passes vacuously on exactly what it
          # should catch. The ELF alignment is what matters, measured
          # here with readelf -lW over every extracted .so (the last
          # column of each LOAD line is p_align; it must be 0x4000 in
          # ALL of them, and there must be at least one PT_LOAD).
          # readelf is part of binutils, preinstalled on the runner; if
          # it ever goes missing, fail loudly instead of passing empty.
          command -v readelf >/dev/null || { echo "::error::readelf not found (binutils): cannot verify 16 KB ELF alignment of the .so files"; exit 1; }
          _SO_DIR="$(mktemp -d)"
          unzip -o -q "$APK" 'lib/arm64-v8a/*.so' -d "$_SO_DIR" || { echo "::error::could not extract the .so files from $APK to verify 16 KB alignment"; rm -rf "$_SO_DIR"; exit 1; }
          for _so in "$_SO_DIR"/lib/arm64-v8a/*.so; do
            readelf -lW "$_so" | awk '/LOAD/ {n++; if ($NF != "0x4000") bad=1} END {exit (n==0 || bad) ? 1 : 0}' || { echo "::error::$(basename "$_so") does not have all PT_LOAD segments with p_align 0x4000 (16 KB): on a 16 KB-page device the dynamic loader rejects it and the app will not start (check with: readelf -lW lib/arm64-v8a/*.so)"; rm -rf "$_SO_DIR"; exit 1; }
          done
          echo "16 KB alignment OK: all .so files have PT_LOAD p_align 0x4000"
          rm -rf "$_SO_DIR"
          # Hunt 2, P2-5: el verify es el ultimo control antes de subir el
          # artefacto y debe validar la firma (que la APK se pueda instalar).
          # Con pipefail (arriba) un verify fallido mata el paso.
          # P1-7: this step gates unsigned APKs: apksigner verify fails on an
          # unsigned APK, so a build that lost its signing credentials
          # (missing secrets/env) dies here instead of shipping an
          # uninstallable artifact.
          # (Ronda 3, auditor B, B-R3-1.) verify solo comprueba que la firma
          # sea VALIDA, no que sea la del keystore corazon: una APK firmada
          # con otro keystore pasaba en verde y no instalaba encima de las
          # builds anteriores. La huella de abajo es la del certificado
          # corazon (apksigner --print-certs sobre las APK v1.1-v1.4.1; ver
          # docs/REXAUTo.md §6). OJO: 8ea1eb60... es el SHA-256 del ARCHIVO
          # .jks, no del certificado: nunca usarlo aqui.
          # (J-4.) Was `ls .../*/apksigner | sort -V | tail -1` (newest
          # installed, today 37.0.0): if verify --print-certs ever changes
          # format, the grep below breaks in a false red. Pin to the AGP
          # build-tools (8.7.3, compileSdk 35 -> 35.0.0) and fail clearly if
          # it is not there instead of silently using another version.
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then echo "::error::apksigner not found at $APKSIGNER (AGP 8.7.3 build-tools 35.0.0) -- check the Android SDK on the runner"; exit 1; fi
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/verify.txt
          EXPECTED_CERT_SHA256="3768a83d38837f424138c1570f77e111bd1777ff6df049d476e562a46bb189ab"
          # (A5-R7-09, ronda 7.) grep -m1 instead of `| head -1`: under
          # pipefail a SIGPIPE'd grep fails the step (the FULL script
          # already fixed the same pattern with grep -m1).
          # (Hunt v1.4.6, ronda 10, A5-R10-04 — corrección del coordinador.)
          # The -m1 above only verified the FIRST signer: an APK with a
          # second signer (re-signed with another key) passed this gate
          # green, the same hole the FULL script's R10-04 fix closes.
          # This grep reads a FILE (/tmp/verify.txt), not a pipe, so there
          # is no SIGPIPE concern in counting all matches. Require exactly
          # one signer, the heart key: the flow does a single `apksigner
          # sign` with a single keystore, so a second signer can only be
          # a re-sign, never legitimate here.
          # (Hunt v1.4.6, ronda 12, A5-R12-03.) grep -c exits 1 on 0
          # matches: without `|| true`, a verify output with no digest
          # line (e.g. an apksigner format change -- the J-4 worry) kills
          # this step with a bare exit 1 under set -euo pipefail instead
          # of reaching the "::error::APK has 0 signers" check below.
          # The FULL script guards the same line with a prior -q check.
          _CERT_COUNT="$(grep -a -c "certificate SHA-256 digest" /tmp/verify.txt || true)"
          if [ "$_CERT_COUNT" != "1" ]; then
            echo "::error::APK has $_CERT_COUNT signers (expected exactly 1, the heart key): a second signer indicates a re-sign."
            exit 1
          fi
          ACTUAL_CERT_SHA256="$(grep -a "certificate SHA-256 digest" /tmp/verify.txt | sed 's/.*digest: *//; s/[^0-9a-fA-F]//g' | tr 'A-F' 'a-f')"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signed with an unexpected certificate (SHA-256 $ACTUAL_CERT_SHA256, expected heart key $EXPECTED_CERT_SHA256). It would NOT install over previous builds -- check CI_KEYSTORE_BASE64."
            exit 1
          fi
          echo "APK certificate SHA-256: $ACTUAL_CERT_SHA256 (heart key OK)"
          # (A5-R7-02, ronda 7.) Verify the BUILT APK's versionCode with
          # aapt2 dump badging: build.gradle.kts used to fall back silently
          # to 1 when -PrexVersionCode was missing (now a hard Gradle
          # failure instead), and the A5-R4-01 guard only checks
          # github.run_number, never the APK -- a lost property would have
          # shipped versionCode 1 while every guard stayed green. aapt2
          # lives next to the apksigner pinned above (build-tools 35.0.0).
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          if [ ! -x "$AAPT2" ]; then echo "::error::aapt2 not found at $AAPT2 (AGP 8.7.3 build-tools 35.0.0) -- check the Android SDK on the runner"; exit 1; fi
          # (A5-R8-04, ronda 8.) Dump to a file first, then grep the file:
          # `aapt2 ... | grep -m1` moved the SIGPIPE onto the producer
          # (aapt2 dies with 141 once grep exits, and pipefail fails the
          # step) -- same lesson as M-13b above (/tmp/apk.txt).
          "$AAPT2" dump badging "$APK" > /tmp/badging.txt || { echo "::error::aapt2 dump badging failed on $APK"; exit 1; }
          # (Hunt v1.4.6, ronda 12, A5-R12-03.) grep -m1 exits 1 on 0
          # matches: without `|| true`, a badging output with no package:
          # line kills this step with a bare exit 1 under set -euo pipefail
          # instead of reaching the versionCode ::error:: below. The FULL
          # script guards the same line with `|| { ...; exit 1; }`.
          # (Trailing space on the old line removed here too.)
          _BADGING="$(grep -a -m1 '^package:' /tmp/badging.txt || true)"
          ACTUAL_VERSION_CODE="$(echo "$_BADGING" | sed "s/.*versionCode='\([0-9]*\)'.*/\1/")"
          ACTUAL_VERSION_NAME="$(echo "$_BADGING" | sed "s/.*versionName='\([^']*\)'.*/\1/")"
          if [ "$ACTUAL_VERSION_CODE" != "${{ github.run_number }}" ]; then
            echo "::error::APK versionCode is $ACTUAL_VERSION_CODE, expected github.run_number ${{ github.run_number }} -- the -PrexVersionCode property did not reach Gradle (see A5-R7-02); a wrong code would not install over previous builds."
            exit 1
          fi
          # (Hunt v1.4.6, ronda 13, A5-R13-10.) versionCode was checked
          # but versionName was only echoed: a lost -PrexVersionName
          # property would ship a wrong versionName with every gate
          # green. The FULL script checks both (A5-R7-02); check both
          # here too.
          if [ "$ACTUAL_VERSION_NAME" != "1.${{ github.run_number }}" ]; then
            echo "::error::APK versionName is $ACTUAL_VERSION_NAME, expected 1.${{ github.run_number }} -- the -PrexVersionName property did not reach Gradle."
            exit 1
          fi
          echo "APK versionCode $ACTUAL_VERSION_CODE (== github.run_number) versionName $ACTUAL_VERSION_NAME OK"
          cp "$APK" "${{ runner.temp }}/${{ env.REX_PROJECT }}-android.apk"
          # (Hunt v1.4.6, ronda 13, A5-R13-09.) The artifact uploaded
          # below is this COPY, not $APK -- and nothing compared them:
          # a cp that corrupted content while keeping the size would
          # ship a bad artifact past every gate above (upload-artifact
          # trusts the local bytes it reads). Mirror the FULL script's
          # R10-03 check: compare SHA-256 of copy vs built APK.
          if [ "$(sha256sum "$APK" | cut -d' ' -f1)" != "$(sha256sum "${{ runner.temp }}/${{ env.REX_PROJECT }}-android.apk" | cut -d' ' -f1)" ]; then
            echo "::error::SHA-256 of the copied APK differs from the built APK (corrupt copy) -- refusing to upload it."
            exit 1
          fi
          # (Hunt v1.4.6, ronda 19, A5-R19-06.) Verify ZIP alignment of
          # the built APK: AGP aligns release APKs automatically, but
          # nothing in CI ever checked the result -- the FULL script
          # gates it twice (pre-firma A5-R17-01, post-firma A5-R18-03)
          # while this step checked everything except alignment. The
          # Android docs say the same for AGP builds: "you should still
          # use zipalign to verify that the APK is aligned, but you
          # don't need to align it"
          # (https://developer.android.com/tools/zipalign). -c is
          # read-only: it cannot change the APK or its signature, and
          # it runs here, after every gate and before the upload, on the
          # same $APK the gates above verified. zipalign lives next to
          # the apksigner/aapt2 pinned above (build-tools 35.0.0).
          _ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          if [ ! -x "$_ZIPALIGN" ]; then echo "::error::zipalign not found at $_ZIPALIGN (AGP 8.7.3 build-tools 35.0.0) -- check the Android SDK on the runner"; exit 1; fi
          "$_ZIPALIGN" -c 4 "$APK" || { echo "::error::zipalign -c failed on $APK (uncompressed entries misaligned -- the APK would install but waste RAM on mmap); check the Gradle/AGP alignment step"; exit 1; }
          echo "APK ZIP alignment OK (zipalign -c 4)"
          SIZE=$(stat -c%s "$APK")
          {
            echo "### ✅ ${{ needs.recompile.outputs.title }} — Android Edition"
            echo ""
            echo "- Title ID: \`${{ needs.recompile.outputs.title_id }}\`"
            echo "- APK: \`${{ env.REX_PROJECT }}-android.apk\` ($((SIZE / 1048576)) MB, arm64-v8a, Vulkan)"
            echo "- Signing certificate SHA-256: \`$ACTUAL_CERT_SHA256\` (heart key)"
            echo ""
            echo "Install the APK and open it — the game starts directly (no home screen, no Play button since v1.3). Graphics, GPU driver and logs live in the in-game menu (gear on the virtual gamepad)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        timeout-minutes: 60
        with:
          name: ${{ env.REX_PROJECT }}-android-apk
          path: ${{ runner.temp }}/${{ env.REX_PROJECT }}-android.apk
          if-no-files-found: error
          retention-days: 7

      # complete Android project: launcher app + recompiled port sources, ready
      # to open in Android Studio (SDK + build outputs excluded)
      - name: Collect project sources
        timeout-minutes: 10
        if: always()
        run: |
          # (Ronda 4, G-F3.) set -e: a failed rsync used to leave a partial
          # source-... artifact with exit 0. Only the optional port rsync
          # below tolerates failure ([ -d ... ] && ...); the cp is
          # required -- the README written in this step tells the user to
          # build with ./android_sdk.sh, so a failed cp must fail the step
          # (A5-R4-07: the old `2>/dev/null || true` swallowed both).
          # (Hunt v1.4.6, ronda 13, A5-R13-11.) The second cp that used
          # to be here (`cp -r rexauto/android/patches "$OUT/android/"`)
          # is gone: the rsync above already copies patches/ (it is not
          # excluded), so the cp re-copied it INSIDE itself, producing a
          # dead $OUT/android/patches/patches/ duplicate in every
          # source artifact. android_sdk.sh still needs its own cp: it
          # lives in rexauto/tools/, outside the rsync source.
          set -euo pipefail
          OUT="${{ runner.temp }}/source-${{ env.REX_PROJECT }}"
          mkdir -p "$OUT"
          rsync -a --exclude sdk --exclude build --exclude .gradle --exclude '*.jks' rexauto/android/ "$OUT/android/"
          [ -d "autoports/${{ env.REX_PROJECT }}/port" ] && rsync -a --exclude build "autoports/${{ env.REX_PROJECT }}/port/" "$OUT/port/"
          cp rexauto/tools/android_sdk.sh "$OUT/"
          cat > "$OUT/README.txt" <<EOF2
          ${{ env.REX_PROJECT }} -- Android project sources

          android/   launcher app (Gradle project)
          port/      recompiled game (generated C++ + src + *.toml)
          Build: run ./android_sdk.sh (needs android/sdk), then
            cd android && ./gradlew assembleRelease -PrexName=${{ env.REX_PROJECT }} \
              -PrexPortDir=\$PWD/../port -PrexSdkDir=\$PWD/sdk/rexglue-sdk
          EOF2
          du -sh "$OUT"

      - name: Upload project sources
        timeout-minutes: 15
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-${{ env.REX_PROJECT }}
          path: ${{ runner.temp }}/source-${{ env.REX_PROJECT }}
          compression-level: 9
          retention-days: 7

      - name: Upload native build logs on failure
        timeout-minutes: 10
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-android-${{ env.REX_PROJECT }}
          path: |
            rexauto/android/app/.cxx/**/*.log
            rexauto/android/app/.cxx/**/CMakeOutput.log
            rexauto/android/app/.cxx/**/CMakeError.log
          if-no-files-found: ignore
          retention-days: 14
